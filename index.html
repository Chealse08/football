<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title id="pageTitle">深鸡蛋坪山公园球王榜</title>
    <style>
        * {margin:0;padding:0;box-sizing:border-box;}
        body {font-family:Microsoft YaHei;background:#f2f3f5;padding:15px;}
        .wrap {max-width:850px;margin:0 auto;background:#fff;border-radius:10px;padding:20px;}
        h1 {text-align:center;margin-bottom:20px;color:#222;}
        h3 {margin-bottom:10px;}
        .box {margin:15px 0;padding:15px;border:1px solid #eee;border-radius:8px;}
        input,select,textarea {width:100%;padding:10px;margin:6px 0;border:1px solid #ccc;border-radius:5px;font-size:16px;}
        textarea {height:150px;resize:vertical;}
        button {padding:10px 16px;border:none;border-radius:5px;cursor:pointer;font-size:15px;margin:4px;}
        .btn-blue {background:#0066cc;color:#fff;}
        .btn-red {background:#dc3545;color:#fff;}
        .btn-green {background:#28a745;color:#fff;}
        .btn-gray {background:#6c757d;color:#fff;}
        .btn-yellow {background:#ffc107;color:#212521;}
        .hide {display:none !important;}
        .tip {color:#666;margin:8px 0;}
        .nav {display:flex;justify-content:center;margin-bottom:20px;gap:10px;flex-wrap:wrap;}
        .nav button {padding:12px 24px;font-size:16px;}
        .nav .active {background:#0066cc;color:#fff;}
        .modal {position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);display:flex;justify-content:center;align-items:center;z-index:1000;}
        .modal-content {background:#fff;padding:25px;border-radius:10px;width:90%;max-width:400px;}
        .modal h3 {margin-bottom:15px;text-align:center;}
        .modal-buttons {display:flex;justify-content:flex-end;margin-top:15px;gap:10px;}
        table {width:100%;border-collapse:collapse;margin-top:10px;}
        th,td {padding:12px;text-align:left;border-bottom:1px solid #eee;}
        th {background:#f8f9fa;font-weight:bold;}
        .rank-1 {color:#ffc107;font-weight:bold;}
        .rank-2 {color:#6c757d;font-weight:bold;}
        .rank-3 {color:#cd7f32;font-weight:bold;}
        .vote-option {padding:10px;border:1px solid #eee;border-radius:5px;margin:8px 0;cursor:pointer;transition:all 0.2s;}
        .vote-option:hover {background:#f8f9fa;}
        .vote-option.selected {background:#0066cc;color:#fff;}
        .vote-bar {height:20px;background:#e9ecef;border-radius:10px;margin-top:5px;overflow:hidden;}
        .vote-progress {height:100%;background:#0066cc;transition:width 0.5s;}
        .content-text {white-space:pre-wrap;line-height:1.8;font-size:16px;}
        .msg-modal-content {text-align:center;}
        .msg-text {font-size:18px;margin:20px 0;}
        .msg-success {color:#28a745;}
        .msg-error {color:#dc3545;}
        .team-card {border:1px solid #eee;border-radius:8px;padding:15px;margin:10px 0;}
        .team-header {display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
        .team-members {margin-top:10px;}
        .signup-list {margin-top:10px;}
        .signup-item {padding:8px 0;border-bottom:1px solid #eee;}
        .status-pending {color:#ffc107;}
        .status-rejected {color:#dc3545;}
        .status-approved {color:#28a745;}
    </style>
</head>
<body>
    <div class="wrap">
        <h1 id="mainTitle">⚽ 深鸡蛋坪山公园球王榜</h1>
        <div class="tip" style="text-align:center;color:#999;">数据云端永久保存</div>
        
        <div class="nav">
            <button class="btn-blue active" onclick="showPage('main')">主界面</button>
            <button class="btn-gray" onclick="showPage('rank')">射手榜</button>
            <button class="btn-gray" onclick="showPage('team')">善意组队</button>
            <button class="btn-gray" onclick="showPage('reward')">奖励规则</button>
            <button class="btn-gray" onclick="showPage('vote')">投票</button>
            <button class="btn-gray" onclick="showPage('admin')">管理后台</button>
        </div>

        <!-- 主界面 -->
        <div id="mainPage">
            <div class="box">
                <div class="tip">注册球员（2位数字密码，不重复）</div>
                <button class="btn-blue" onclick="openRegisterModal()">注册新球员</button>
            </div>
            <div class="box">
                <div class="tip">选择球员 → 选比赛时间 → 提交进球</div>
                <select id="playerSelect"><option value="">请选择已认证球员</option></select>
                <button class="btn-blue" onclick="openGoalModal()">提交进球记录</button>
            </div>
        </div>

        <!-- 射手榜 -->
        <div id="rankPage" class="hide">
            <div class="box"><h3>🏆 射手榜</h3><div id="rankList"></div></div>
        </div>

        <!-- 善意组队页面（密码保护） -->
        <div id="teamPage" class="hide">
            <!-- 身份验证区域 -->
            <div id="teamAuthSection">
                <div class="box">
                    <h3>🔐 请验证球员身份</h3>
                    <select id="teamAuthPlayerSelect"><option value="">请选择你的球员</option></select>
                    <input type="password" id="teamAuthPwd" placeholder="球员2位密码" maxlength="2">
                    <button class="btn-blue" onclick="authTeamPage()">进入组队页面</button>
                </div>
            </div>

            <!-- 组队内容区域（验证通过后显示） -->
            <div id="teamContentSection" class="hide">
                <!-- 当前比赛 -->
                <div class="box">
                    <h3>⚽ 当前比赛</h3>
                    <div id="currentMatch"></div>
                    <div id="adminMatchControls" class="hide">
                        <input type="datetime-local" id="matchTimeInput">
                        <input type="text" id="matchLocationInput" placeholder="比赛地点">
                        <button class="btn-green" onclick="createMatch()">创建比赛</button>
                        <button class="btn-red" onclick="endMatch()">结束比赛</button>
                    </div>
                </div>

                <!-- 报名接龙 -->
                <div class="box">
                    <h3>📋 报名接龙（最多27人）</h3>
                    <div id="signupCount" class="tip"></div>
                    <div id="signupList" class="signup-list"></div>
                    <div id="signupControls">
                        <button class="btn-blue" onclick="signupMatch()">我要报名</button>
                        <button class="btn-red" onclick="cancelSignup()">取消报名</button>
                    </div>
                </div>

                <!-- 小队列表（显示所有成员和申请状态） -->
                <div class="box">
                    <h3>🏃 小队列表</h3>
                    <div id="teamList"></div>
                    <div style="margin-top:15px;">
                        <button class="btn-blue" onclick="openCreateTeamModal()">申请创建小队</button>
                    </div>
                </div>

                <!-- 我的小队与申请记录 -->
                <div id="myTeamSection" class="box hide">
                    <h3>👥 我的信息</h3>
                    <div id="myTeamInfo"></div>
                </div>
            </div>
        </div>

        <!-- 奖励页面 -->
        <div id="rewardPage" class="hide">
            <div class="box">
                <h3>🏆 赛季奖励规则</h3>
                <div id="rewardContent" class="content-text"></div>
                <div id="adminRewardEdit" class="hide" style="margin-top:15px;">
                    <textarea id="rewardInput" placeholder="输入奖励规则，支持换行"></textarea>
                    <button class="btn-blue" onclick="saveReward()">保存奖励规则</button>
                </div>
            </div>
        </div>

        <!-- 投票页面 -->
        <div id="votePage" class="hide">
        <!-- 身份验证区域 -->
            <div id="voteAuthSection">
                <div class="box">
                    <h3>🔐 请验证球员身份</h3>
                    <select id="voteAuthPlayerSelect"><option value="">请选择你的球员</option></select>
                    <input type="password" id="voteAuthPwd" placeholder="球员2位密码" maxlength="2">
                    <button class="btn-blue" onclick="authVotePage()">进入投票</button>    
                  </div>
                </div>
            <!-- 投票内容区域（验证通过后显示） -->
            <div id="voteContentSection" class="hide">
                <div class="box">
                    <h3 id="voteTitle">最佳球员投票</h3>
                    <div id="adminVoteControls" class="hide">
                        <input type="text" id="newVoteTitle" placeholder="投票题目">
                        <button class="btn-yellow" onclick="setVoteTitle()">修改题目</button>
                        <button class="btn-red" onclick="resetVote()">重置投票</button>
                    </div>
                    <div id="voteOptions"></div>
                    <div class="box">
                        <button class="btn-blue" onclick="submitVote()">投票</button>
                    </div>
                    <div id="voteResults"></div>
                </div>
            </div>
        </div>

        <!-- 管理后台 -->
        <div id="adminPage" class="hide">
            <div class="box">
                <input type="password" id="adminPwd" placeholder="管理员密码">
                <button class="btn-green" onclick="adminLogin()">登录</button>
            </div>

            <div id="adminPanel" class="hide">
                <div class="box">
                    <h3>📛 修改网站标题</h3>
                    <input type="text" id="customTitleInput" placeholder="输入新标题">
                    <button class="btn-blue" onclick="saveCustomTitle()">保存标题</button>
                </div>

                <div class="box">
                    <h3>📅 进球比赛时间管理</h3>
                    <input type="datetime-local" id="goalMatchTimeInput">
                    <button class="btn-green" onclick="addGoalMatchTime()">添加时间</button>
                    <div id="goalMatchTimeList"></div>
                </div>

                <div class="box">
                    <h3>👤 球员管理（设置场次｜追加进球）</h3>
                    <div id="registeredPlayersList"></div>
                </div>

                <div class="box"><h3>待审核球员</h3><div id="waitPlayerList"></div></div>
                <div class="box"><h3>待审核进球</h3><div id="waitGoalList"></div></div>
                <div class="box"><h3>✅ 已通过进球（可撤销）</h3><div id="passedGoalsList"></div></div>
                <div class="box"><h3>⏳ 待审核小队</h3><div id="pendingTeamsList"></div></div>
            </div>
        </div>
    </div>

    <!-- 注册弹窗 -->
    <div id="registerModal" class="modal hide">
        <div class="modal-content">
            <h3>注册球员</h3>
            <input type="text" id="registerName" placeholder="姓名">
            <input type="password" id="registerPwd" placeholder="2位数字密码" maxlength="2">
            <div class="modal-buttons">
                <button class="btn-gray" onclick="closeModal('registerModal')">取消</button>
                <button class="btn-blue" onclick="submitNewPlayer()">注册</button>
            </div>
        </div>
    </div>

    <!-- 提交进球弹窗 -->
    <div id="goalModal" class="modal hide">
        <div class="modal-content">
            <h3>提交进球</h3>
            <p id="selectedPlayerName"></p>
            <input type="password" id="playerPwd" placeholder="2位密码" maxlength="2">
            <input type="number" id="goalNum" min="1" value="1" placeholder="进球数">
            <input type="text" id="matchLocation" placeholder="地点">
            <select id="matchTimeSelect"></select>
            <div class="modal-buttons">
                <button class="btn-gray" onclick="closeModal('goalModal')">取消</button>
                <button class="btn-blue" onclick="submitGoalRecord()">提交</button>
            </div>
        </div>
    </div>

    <!-- 创建小队弹窗 -->
    <div id="createTeamModal" class="modal hide">
        <div class="modal-content">
            <h3>申请创建小队</h3>
            <input type="text" id="teamName" placeholder="小队名称">
            <input type="text" id="teamCode" placeholder="4位进队码" maxlength="4">
            <div class="modal-buttons">
                <button class="btn-gray" onclick="closeModal('createTeamModal')">取消</button>
                <button class="btn-blue" onclick="submitCreateTeam()">提交申请</button>
            </div>
        </div>
    </div>

    <!-- 加入小队弹窗 -->
    <div id="joinTeamModal" class="modal hide">
        <div class="modal-content">
            <h3>加入小队</h3>
            <input type="text" id="joinTeamCode" placeholder="进队码（可选，直接加入）">
            <div class="modal-buttons">
                <button class="btn-gray" onclick="closeModal('joinTeamModal')">取消</button>
                <button class="btn-blue" onclick="submitJoinTeam()">申请加入</button>
            </div>
        </div>
    </div>

    <!-- 全局消息弹窗 -->
    <div id="msgModal" class="modal hide">
        <div class="modal-content msg-modal-content">
            <div id="msgText" class="msg-text"></div>
            <button class="btn-blue" onclick="closeMsgModal()">确定</button>
        </div>
    </div>

    <script>
        const ADMIN_PWD = "20041202";
        const API_URL = "https://footballpoint.top";
        let selectedPlayerId = "";
        let selectedVoteOption = null;
        let isAdminLoggedIn = false;
        let currentTeamId = null;
        let currentPlayerId = null; // 组队页验证后的当前球员ID
        let currentPlayerPwd = null; // 组队页验证后的当前球员密码
        let currentVotePlayerId = null; // 投票页验证后的当前球员ID
        let currentVotePlayerPwd = null; // 投票页验证后的当前球员密码

        window.onload = async function () {
            await loadCustomTitle();
            await loadReward();
            renderPlayerSelect();
            loadGoalMatchTimes();
        };

        // 弹窗提示
        function showMsg(text, isOk) {
            const msgText = document.getElementById("msgText");
            msgText.innerText = text;
            msgText.className = isOk ? "msg-text msg-success" : "msg-text msg-error";
            document.getElementById("msgModal").classList.remove("hide");
        }

        function closeMsgModal() {
            document.getElementById("msgModal").classList.add("hide");
        }

        async function showPage(pageName) {
            document.getElementById("mainPage").classList.add("hide");
            document.getElementById("rankPage").classList.add("hide");
            document.getElementById("teamPage").classList.add("hide");
            document.getElementById("rewardPage").classList.add("hide");
            document.getElementById("votePage").classList.add("hide");
            document.getElementById("adminPage").classList.add("hide");
            document.querySelectorAll(".nav button").forEach(b=>b.className="btn-gray");
            event.target.className="btn-blue active";
            document.getElementById(pageName+"Page").classList.remove("hide");
            
            if(pageName==="rank")renderRank();
            if(pageName==="reward")loadReward();
            if(pageName==="vote"){
                // 检查是否已验证
                if(currentVotePlayerId) {
                    document.getElementById("voteAuthSection").classList.add("hide");
                    document.getElementById("voteContentSection").classList.remove("hide");
                    await renderVote();
                } else {
                    document.getElementById("voteAuthSection").classList.remove("hide");
                    document.getElementById("voteContentSection").classList.add("hide");
                    // 只加载已审核通过的球员
                    const r = await fetch(API_URL+"/players");
                    const list = await r.json();
                    let h = `<option value="">请选择</option>`;
                    list.forEach(it=>h+=`<option value="${it.id}">${it.name}</option>`);
                    document.getElementById("voteAuthPlayerSelect").innerHTML = h;
                }
            }
            if(pageName==="admin"){
                renderRegisteredPlayers();
                renderWaitPlayer();
                renderWaitGoal();
                renderPassedGoals();
                renderGoalMatchTimeList();
                renderPendingTeams();
            }
            if(pageName==="team"){
                // 检查是否已验证
                if(currentPlayerId) {
                    document.getElementById("teamAuthSection").classList.add("hide");
                    document.getElementById("teamContentSection").classList.remove("hide");
                    await loadTeamContent();
                } else {
                    document.getElementById("teamAuthSection").classList.remove("hide");
                    document.getElementById("teamContentSection").classList.add("hide");
                    // 加载球员选择框
                    const r = await fetch(API_URL+"/players");
                    const list = await r.json();
                    let h = `<option value="">请选择</option>`;
                    list.forEach(it=>h+=`<option value="${it.id}">${it.name}</option>`);
                    document.getElementById("teamAuthPlayerSelect").innerHTML = h;
                }
            }
        }

        // 标题管理
        async function loadCustomTitle() {
            try {
                const res = await fetch(API_URL+"/getCustomTitle");
                const d = await res.json();
                if(d.title){
                    document.getElementById("pageTitle").innerText = d.title;
                    document.getElementById("mainTitle").innerText = "⚽ "+d.title;
                }
            }catch(e){}
        }
        async function saveCustomTitle() {
            const t = document.getElementById("customTitleInput").value.trim();
            if(!t){showMsg("请输入标题",false);return;}
            const r = await fetch(API_URL+"/setCustomTitle",{
                method:"POST",headers:{"Content-Type":"application/json"},
                body:JSON.stringify({title:t,adminPwd:ADMIN_PWD})
            });
            const d=await r.json();
            showMsg(d.success?"标题已修改":d.error,d.success);
            if(d.success)loadCustomTitle();
        }

        // 奖励管理
        async function loadReward() {
            try {
                const res = await fetch(API_URL+"/getReward");
                const d = await res.json();
                document.getElementById("rewardContent").innerText = d.content || "暂无奖励规则";
                document.getElementById("rewardInput").value = d.content || "";
                if(isAdminLoggedIn) {
                    document.getElementById("adminRewardEdit").classList.remove("hide");
                }
            }catch(e){
                document.getElementById("rewardContent").innerText = "加载失败";
            }
        }
        async function saveReward() {
            const content = document.getElementById("rewardInput").value.trim();
            const r = await fetch(API_URL+"/setReward",{
                method:"POST",headers:{"Content-Type":"application/json"},
                body:JSON.stringify({content,adminPwd:ADMIN_PWD})
            });
            const d=await r.json();
            showMsg(d.success?"奖励规则已保存":d.error,d.success);
            if(d.success)loadReward();
        }

        // ======================
        // 组队页身份验证
        // ======================
        async function authTeamPage() {
            const pid = document.getElementById("teamAuthPlayerSelect").value;
            const pwd = document.getElementById("teamAuthPwd").value.trim();
            if(!pid || pwd.length !== 2) {
                showMsg("请选择球员并输入正确的2位密码", false);
                return;
            }
            // 验证密码
            const res = await fetch(API_URL+"/players");
            const players = await res.json();
            const player = players.find(p => p.id == pid);
            if(!player || player.password !== pwd) {
                showMsg("密码错误", false);
                return;
            }
            // 验证成功
            currentPlayerId = pid;
            currentPlayerPwd = pwd;
            document.getElementById("teamAuthSection").classList.add("hide");
            document.getElementById("teamContentSection").classList.remove("hide");
            await loadTeamContent();
            showMsg("身份验证成功", true);
        }

        // ======================
        // 投票页身份验证
        // ======================
        async function authVotePage() {
            const pid = document.getElementById("voteAuthPlayerSelect").value;
            const pwd = document.getElementById("voteAuthPwd").value.trim();
            if(!pid || pwd.length !== 2) {
                showMsg("请选择球员并输入正确的2位密码", false);
                return;
            }
            // 验证密码（只从已审核通过的球员中验证）
            const res = await fetch(API_URL+"/players");
            const players = await res.json();
            const player = players.find(p => p.id == pid);
            if(!player || player.password !== pwd) {
                showMsg("密码错误", false);
                return;
            }
            // 验证成功
            currentVotePlayerId = pid;
            currentVotePlayerPwd = pwd;
            document.getElementById("voteAuthSection").classList.add("hide");
            document.getElementById("voteContentSection").classList.remove("hide");
            await renderVote();
            showMsg("身份验证成功", true);
        }
 
        // ======================
        // 比赛组队核心功能
        // ======================
        async function loadTeamContent() {
            await loadCurrentMatch();
            await loadSignupList();
            await loadTeamList();
            await loadMyTeamAndApplications();
            if(isAdminLoggedIn) {
                document.getElementById("adminMatchControls").classList.remove("hide");
            }
        }

        // 当前比赛
        async function loadCurrentMatch() {
            try {
                const res = await fetch(API_URL+"/getCurrentMatch");
                const d = await res.json();
                if(d.match) {
                    const time = new Date(d.match.time).toLocaleString();
                    document.getElementById("currentMatch").innerHTML = `
                        <p><strong>时间：</strong>${time}</p>
                        <p><strong>地点：</strong>${d.match.location}</p>
                        <p><strong>状态：</strong>进行中</p>
                    `;
                } else {
                    document.getElementById("currentMatch").innerHTML = "<p>暂无进行中的比赛</p>";
                }
            }catch(e){
                document.getElementById("currentMatch").innerHTML = "<p>加载失败</p>";
            }
        }

        // 创建比赛
        async function createMatch() {
            const time = document.getElementById("matchTimeInput").value;
            const location = document.getElementById("matchLocationInput").value.trim();
            if(!time || !location) {showMsg("请填写时间和地点",false);return;}
            const r = await fetch(API_URL+"/createMatch",{
                method:"POST",headers:{"Content-Type":"application/json"},
                body:JSON.stringify({time,location,adminPwd:ADMIN_PWD})
            });
            const d=await r.json();
            showMsg(d.success?"比赛创建成功":d.error,d.success);
            if(d.success)loadTeamContent();
        }

        // 结束比赛
        async function endMatch() {
            if(!confirm("确定结束当前比赛？所有报名和小队将清空"))return;
            const r = await fetch(API_URL+"/endMatch",{
                method:"POST",headers:{"Content-Type":"application/json"},
                body:JSON.stringify({adminPwd:ADMIN_PWD})
            });
            const d=await r.json();
            showMsg(d.success?"比赛已结束":d.error,d.success);
            if(d.success)loadTeamContent();
        }

        // 报名接龙
        async function loadSignupList() {
            try {
                const res = await fetch(API_URL+"/getSignupList");
                const d = await res.json();
                document.getElementById("signupCount").innerText = `已报名：${d.signups.length}/27人`;
                let h = "";
                d.signups.forEach((p,i)=>{
                    h+=`<div class="signup-item">${i+1}. ${p.name} ${p.id == currentPlayerId ? "(我)" : ""}</div>`;
                });
                document.getElementById("signupList").innerHTML = h || "<p>暂无报名</p>";
            }catch(e){
                document.getElementById("signupList").innerHTML = "<p>加载失败</p>";
            }
        }

        async function signupMatch() {
            if(!currentPlayerId) {showMsg("请先验证身份",false);return;}
            const r = await fetch(API_URL+"/signupMatch",{
                method:"POST",headers:{"Content-Type":"application/json"},
                body:JSON.stringify({pid:currentPlayerId,password:currentPlayerPwd})
            });

        async function loadTeamList() {

                const res = await fetch(API_URL+"/getApprovedTeams");
                const d = await res.json();
                let h = "";
                d.teams.forEach(team=>{
                    // 查找当前用户在该小队的状态
                    let myStatus = "";
                    const isMember = team.members.some(m => m.id == currentPlayerId);
                    const myApp = team.pending.find(p => p.id == currentPlayerId);
                    
                    if(isMember) {
                        myStatus = '<span class="status-approved">你已加入该小队</span>';
                    } else if(myApp) {
                        if(myApp.status === 'pending') {
                            myStatus = '<span class="status-pending">你的申请：审核中</span>';
                        } else if(myApp.status === 'rejected') {
                            myStatus = '<span class="status-rejected">你的申请：已被拒绝</span>';
                        }
                    }

                    h+=`
                    <div class="team-card">
                        <div class="team-header">
                            <h4>${team.name}</h4>
                            <span>队长：${team.captainName}</span>
                        </div>
                        <div class="team-members">
                            <p>成员（${team.members.length}人）：${team.members.map(m=>m.name).join("、") || "暂无"}</p>
                            ${team.pending.filter(p=>p.status==='pending').length > 0 ? `
                                <p style="margin-top:5px;color:#666;">待审核：${team.pending.filter(p=>p.status==='pending').map(p=>p.name).join("、")}</p>
                            ` : ""}
                        </div>
                        ${myStatus ? `<p style="margin-top:8px;">${myStatus}</p>` : ""}
                        ${!isMember && (!myApp || myApp.status === 'rejected') ? `
                            <button class="btn-blue" onclick="openJoinTeamModal(${team.id})">申请加入</button>
                        ` : ""}
                    </div>
                    `;
                });
                document.getElementById("teamList").innerHTML = h || "<p>暂无已通过的小队</p>";

                document.getElementById("teamList").innerHTML = "<p>加载失败</p>";

        // 投票
        async function renderVote(){
            try {
                const r=await fetch(API_URL+"/vote");
                if(!r.ok) throw new Error("API请求失败");
                const d=await r.json();
                if(!d) throw new Error("数据为空");
                
                document.getElementById("voteTitle").innerText=d.title || "最佳球员投票";
                document.getElementById("adminVoteControls").classList.toggle("hide",!isAdminLoggedIn);
                
                const options = d.options || [];
                let h="";
                if(options.length === 0) {
                    h = "<p style='color:#999;'>暂无投票选项</p>";
                } else {
                    options.forEach(o=>{
                        h+=`<div class="vote-option" data-id="${o.id}" onclick="selectVoteOption(${o.id})">${o.name}</div>`;
                    });
                }
                document.getElementById("voteOptions").innerHTML=h;
                
                const votes = d.votes || {};
                let total=0;
                try {
                    total=Object.values(votes).reduce((a,b)=>a+b,0);
                } catch(e) { total = 0; }
                
                let rs=`<h4>总票：${total}</h4>`;
                options.map(p=>({...p,v:votes[p.id]||0})).sort((a,b)=>b.v-a.v).forEach(x=>{
                    const per=total?Math.round(x.v/total*100):0;
                    rs+=`<div style="margin:6px 0;"><div style="display:flex;justify-content:space-between;"><span>${x.name}</span><span>${x.v}票 ${per}%</span></div><div class="vote-bar"><div class="vote-progress" style="width:${per}%"></div></div></div>`;
                });
                document.getElementById("voteResults").innerHTML=rs;
            } catch(e) {
                console.error("投票加载失败:", e);
                document.getElementById("voteOptions").innerHTML="<p style='color:red;'>投票加载失败，请刷新重试</p>";
                document.getElementById("voteResults").innerHTML="";
            }
        }

                    <button class="btn-green" onclick="passPlayer(${it.id})">通过</button>
                    <button class="btn-red" onclick="rejectPlayer(${it.id})">驳回</button>
                    <button class="btn-red" onclick="deletePlayer(${it.id})">删除</button>
                </div>`;
            });
            document.getElementById("waitPlayerList").innerHTML=h;
        }
        async function renderWaitGoal(){
            const r=await fetch(API_URL+"/waitMatches");
            const list=await r.json();
            let h=list.length?"":"<p>暂无</p>";
            list.forEach(it=>{
                const t=new Date(it.time).toLocaleString();
                h+=`<div style="padding:8px;border-bottom:1px solid #eee;">${it.pName}｜${it.goal}球｜${it.location}｜${t}
                    <button class="btn-green" onclick="passGoal(${it.id})">通过</button>
                    <button class="btn-red" onclick="rejectGoal(${it.id})">驳回</button>
                </div>`;
            });
            document.getElementById("waitGoalList").innerHTML=h;
        }
        async function renderPassedGoals(){
            const r=await fetch(API_URL+"/");
            const data=await r.json();
            const list=data.matches||[];
            let h=list.length?"":"<p>暂无</p>";
            list.forEach(it=>{
                const t=new Date(it.time).toLocaleString();
                h+=`<div style="padding:8px;border-bottom:1px solid #eee;">${it.pName}｜${it.goal}球｜${it.location}｜${t}
                    <button class="btn-red" onclick="undoGoal(${it.id})">撤销该进球</button>
                </div>`;
            });
            document.getElementById("passedGoalsList").innerHTML=h;
        }

        // 射手榜
        async function renderRank(){
            const r=await fetch(API_URL+"/players");
            const list=await r.json();
            list.sort((a,b)=>(b.totalGoals||0)-(a.totalGoals||0));
            let h="<table><tr><th>排名</th><th>球员</th><th>进球</th><th>场次</th></tr>";
            list.forEach((it,i)=>{
                let c="";
                if(i===0)c="rank-1";if(i===1)c="rank-2";if(i===2)c="rank-3";
                h+=`<tr><td class="${c}">${i+1}</td><td>${it.name}</td><td>${it.totalGoals||0}</td><td>${it.totalMatches||0}</td></tr>`;
            });
            h+="</table>";
            document.getElementById("rankList").innerHTML=h;
        }

        // 点击弹窗背景关闭
        document.querySelectorAll('.modal').forEach(modal => {
            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    modal.classList.add('hide');
                }
            });
        });
    </script>
</body>
</html>
