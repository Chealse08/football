<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>深🐔🥚坪山公园进球榜</title>
    <style>
        * {margin:0;padding:0;box-sizing:border-box;}
        body {font-family:Microsoft YaHei;background:#f2f3f5;padding:15px;}
        .wrap {max-width:850px;margin:0 auto;background:#fff;border-radius:10px;padding:20px;}
        h1 {text-align:center;margin-bottom:20px;color:#222;}
        .box {margin:15px 0;padding:15px;border:1px solid #eee;border-radius:8px;}
        input,select {width:100%;padding:10px;margin:6px 0;border:1px solid #ccc;border-radius:5px;font-size:16px;}
        button {padding:10px 16px;border:none;border-radius:5px;cursor:pointer;font-size:15px;margin:4px;}
        .btn-blue {background:#0066cc;color:#fff;}
        .btn-red {background:#dc3545;color:#fff;}
        .btn-green {background:#28a745;color:#fff;}
        .btn-gray {background:#6c757d;color:#fff;}
        .btn-yellow {background:#ffc107;color:#212529;}
        .hide {display:none !important;}
        .tip {color:#666;margin:8px 0;}
        .msg {padding:10px;border-radius:5px;margin:10px 0;text-align:center;display:none;}
        .success {background:#d4edda;color:#155724;display:block;}
        .error {background:#f8d7da;color:#721c24;display:block;}
        .nav {display:flex;justify-content:center;margin-bottom:20px;gap:10px;flex-wrap:wrap;}
        .nav button {padding:12px 24px;font-size:16px;}
        .nav .active {background:#0066cc;color:#fff;}
        .modal {position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);display:flex;justify-content:center;align-items:center;z-index:1000;}
        .modal-content {background:#fff;padding:25px;border-radius:10px;width:90%;max-width:400px;}
        .modal h3 {margin-bottom:15px;text-align:center;}
        .modal-buttons {display:flex;justify-content:flex-end;margin-top:15px;gap:10px;}
        table {width:100%;border-collapse:collapse;margin-top:10px;}
        th,td {padding:12px;text-align:left;border-bottom:1px solid #eee;}
        th {background:#f8f9fa;font-weight:bold;}
        .rank-1 {color:#ffc107;font-weight:bold;}
        .rank-2 {color:#6c757d;font-weight:bold;}
        .rank-3 {color:#cd7f32;font-weight:bold;}
        .vote-option {padding:10px;border:1px solid #eee;border-radius:5px;margin:8px 0;cursor:pointer;transition:all 0.2s;}
        .vote-option:hover {background:#f8f9fa;}
        .vote-option.selected {background:#0066cc;color:#fff;}
        .vote-bar {height:20px;background:#e9ecef;border-radius:10px;margin-top:5px;overflow:hidden;}
        .vote-progress {height:100%;background:#0066cc;transition:width 0.5s;}
    </style>
</head>
<body>
    <div class="wrap">
        <h1>⚽ 谁是深🐔🥚坪山公园球王？</h1>
        <div class="tip" style="text-align:center;color:#999;margin-bottom:20px;">当前：云端模式（数据永久保存）</div>
        
        <div class="nav">
            <button class="btn-blue active" onclick="showPage('main')">主界面</button>
            <button class="btn-gray" onclick="showPage('rank')">射手榜</button>
            <button class="btn-gray" onclick="showPage('vote')">投票</button>
            <button class="btn-gray" onclick="showPage('admin')">管理后台</button>
        </div>

        <div id="msgBox" class="msg"></div>

        <div id="mainPage">
            <div class="box">
                <div class="tip">第一步：注册新球员（需设置2位数字密码），等待管理员审核认证</div>
                <button class="btn-blue" onclick="openRegisterModal()">注册新球员</button>
            </div>

            <div class="box">
                <div class="tip">第二步：选择已审核通过球员，输入球员密码，提交进球记录</div>
                <select id="playerSelect">
                    <option value="">请先选择已认证球员</option>
                </select>
                <button class="btn-blue" onclick="openGoalModal()">提交进球记录</button>
            </div>
        </div>

        <div id="rankPage" class="hide">
            <div class="box">
                <h3>🏆 射手榜（按总进球数排名）</h3>
                <div id="rankList"></div>
            </div>
        </div>

        <div id="votePage" class="hide">
            <div class="box">
                <h3 id="voteTitle">最佳球员投票</h3>
                <div id="adminVoteControls" class="hide">
                    <input type="text" id="newVoteTitle" placeholder="输入新的投票题目">
                    <button class="btn-yellow" onclick="setVoteTitle()">设置投票题目</button>
                    <button class="btn-red" onclick="resetVote()">重置所有投票</button>
                </div>
                <div id="voteOptions"></div>
                <div class="box" id="votePasswordBox">
                    <input type="password" id="votePlayerPwd" placeholder="输入你的球员密码进行投票">
                    <button class="btn-blue" onclick="submitVote()">提交投票</button>
                </div>
                <div id="voteResults"></div>
            </div>
        </div>

        <div id="adminPage" class="hide">
            <div class="box">
                <input type="password" id="adminPwd" placeholder="输入管理员密码登录">
                <button class="btn-green" onclick="adminLogin()">登录</button>
            </div>

            <div id="adminPanel" class="hide">
                <div class="box">
                    <h3>✅ 管理员操作区</h3>
                    <button class="btn-red" onclick="undoGoal()">撤销最后一个进球</button>
                </div>

                <div class="box">
                    <h3>已注册球员信息（含密码）</h3>
                    <div id="registeredPlayersList"></div>
                </div>

                <div class="box">
                    <h3>待审核球员名单</h3>
                    <div id="waitPlayerList"></div>
                </div>

                <div class="box">
                    <h3>待审核进球记录（含地点时间）</h3>
                    <div id="waitGoalList"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="registerModal" class="modal hide">
        <div class="modal-content">
            <h3>注册新球员</h3>
            <input type="text" id="registerName" placeholder="输入球员姓名">
            <input type="password" id="registerPwd" placeholder="设置2位数字密码" maxlength="2" pattern="[0-9]{2}">
            <div class="modal-buttons">
                <button class="btn-gray" onclick="closeModal('registerModal')">取消</button>
                <button class="btn-blue" onclick="submitNewPlayer()">确认注册</button>
            </div>
        </div>
    </div>

    <div id="goalModal" class="modal hide">
        <div class="modal-content">
            <h3>提交进球记录</h3>
            <p id="selectedPlayerName"></p>
            <input type="password" id="playerPwd" placeholder="输入该球员的2位密码" maxlength="2">
            <input type="number" id="goalNum" placeholder="输入进球数" min="1" value="1">
            <input type="text" id="matchLocation" placeholder="比赛地点（可选）">
            
            <!-- 球员只能选择，不能输入时间 -->
            <select id="matchTimeSelect" style="padding:10px;width:100%;margin:6px 0;">
                <option value="2025-11-01T15:00">2025-11-01 15:00</option>
                <option value="2025-11-08T15:00">2025-11-08 15:00</option>
                <option value="2025-11-15T15:00">2025-11-15 15:00</option>
                <option value="2025-11-22T15:00">2025-11-22 15:00</option>
                <option value="2025-11-29T15:00">2025-11-29 15:00</option>
            </select>

            <div class="modal-buttons">
                <button class="btn-gray" onclick="closeModal('goalModal')">取消</button>
                <button class="btn-blue" onclick="submitGoalRecord()">确认提交</button>
            </div>
        </div>
    </div>

    <script>
        const ADMIN_PWD = "20041202";
        const API_URL = "https://footballpoint.top";
        let selectedPlayerId = "";
        let selectedVoteOption = null;
        let isAdminLoggedIn = false;

        window.onload = function () {
            renderPlayerSelect();
        };

        function showMsg(text, isOk) {
            const box = document.getElementById("msgBox");
            box.innerText = text;
            box.className = isOk ? "success" : "error";
            setTimeout(() => { box.className = "msg"; }, 2500);
        }

        function showPage(pageName) {
            document.getElementById("mainPage").classList.add("hide");
            document.getElementById("rankPage").classList.add("hide");
            document.getElementById("votePage").classList.add("hide");
            document.getElementById("adminPage").classList.add("hide");
            document.querySelectorAll(".nav button").forEach(btn => btn.className = "btn-gray");
            event.target.className = "btn-blue active";
            document.getElementById(pageName + "Page").classList.remove("hide");
            if (pageName === "rank") renderRank();
            if (pageName === "vote") renderVote();
            if (pageName === "admin") {
                renderRegisteredPlayers();
                renderWaitPlayer();
                renderWaitGoal();
            }
        }

        function openRegisterModal() {
            document.getElementById("registerName").value = "";
            document.getElementById("registerPwd").value = "";
            document.getElementById("registerModal").classList.remove("hide");
        }

        function openGoalModal() {
            selectedPlayerId = document.getElementById("playerSelect").value;
            if (!selectedPlayerId) { showMsg("请先选择已认证球员", false); return; }
            const playerName = document.getElementById("playerSelect").selectedOptions[0].text.split(" ")[0];
            document.getElementById("selectedPlayerName").innerText = `球员：${playerName}`;
            document.getElementById("playerPwd").value = "";
            document.getElementById("goalNum").value = "1";
            document.getElementById("matchLocation").value = "";
            document.getElementById("goalModal").classList.remove("hide");
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.add("hide");
        }

        // 注册：2位密码 + 不重复
        async function submitNewPlayer() {
            const name = document.getElementById("registerName").value.trim();
            const pwd = document.getElementById("registerPwd").value.trim();
            if (!name) { showMsg("请输入球员姓名", false); return; }
            if (!pwd || pwd.length !== 2 || !/^\d{2}$/.test(pwd)) { showMsg("请输入2位数字密码", false); return; }
            
            try {
                const res = await fetch(`${API_URL}/addPlayer`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ name, password: pwd })
                });
                const data = await res.json();
                if (!data.success) {
                    showMsg(data.error, false);
                    return;
                }
                showMsg("球员注册成功，等待管理员审核！", true);
                closeModal("registerModal");
            } catch (err) {
                showMsg("提交失败：" + err.message, false);
            }
        }

        // 提交进球：只能选时间
        async function submitGoalRecord() {
            const pwd = document.getElementById("playerPwd").value.trim();
            const goal = parseInt(document.getElementById("goalNum").value);
            const location = document.getElementById("matchLocation").value.trim();
            const time = document.getElementById("matchTimeSelect").value;

            if (!pwd || pwd.length !== 2 || !/^\d{2}$/.test(pwd)) { showMsg("请输入正确2位密码", false); return; }
            if (!goal || goal < 1) { showMsg("请输入合法进球数", false); return; }
            
            try {
                const res = await fetch(`${API_URL}/addGoal`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ 
                        pid: selectedPlayerId, 
                        password: pwd, 
                        goal, 
                        location: location || "未填写", 
                        time 
                    })
                });
                const result = await res.json();
                if (!res.ok) throw new Error(result.error || "密码错误");
                showMsg("提交成功，等待审核！", true);
                closeModal("goalModal");
            } catch (err) {
                showMsg("失败：" + err.message, false);
            }
        }

        async function renderVote() {
            try {
                const res = await fetch(`${API_URL}/vote`);
                const d = await res.json();
                document.getElementById("voteTitle").innerText = d.title;
                if (isAdminLoggedIn) {
                    document.getElementById("adminVoteControls").classList.remove("hide");
                    document.getElementById("newVoteTitle").value = d.title;
                } else {
                    document.getElementById("adminVoteControls").classList.add("hide");
                }
                let opts = "";
                d.options.forEach(p => {
                    opts += `<div class="vote-option" data-id="${p.id}" onclick="selectVoteOption(${p.id})">${p.name}</div>`;
                });
                document.getElementById("voteOptions").innerHTML = opts;
                renderVoteResults(d);
            } catch {
                document.getElementById("voteOptions").innerHTML = "<p>加载失败</p>";
            }
        }

        function selectVoteOption(id) {
            document.querySelectorAll(".vote-option").forEach(o => o.classList.remove("selected"));
            document.querySelector(`.vote-option[data-id="${id}"]`).classList.add("selected");
            selectedVoteOption = id;
        }

        async function submitVote() {
            if (!selectedVoteOption) { showMsg("请选择候选人", false); return; }
            const pwd = document.getElementById("votePlayerPwd").value.trim();
            if (!pwd || pwd.length !== 2) { showMsg("请输入2位球员密码", false); return; }
            try {
                const res = await fetch(`${API_URL}/vote`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ playerId: selectedVoteOption, password: pwd })
                });
                const j = await res.json();
                if (!res.ok) throw new Error(j.error);
                showMsg("投票成功", true);
                document.getElementById("votePlayerPwd").value = "";
                selectedVoteOption = null;
                renderVote();
            } catch (e) {
                showMsg(e.message, false);
            }
        }

        async function setVoteTitle() {
            const t = document.getElementById("newVoteTitle").value.trim();
            if (!t) return;
            await fetch(`${API_URL}/setVoteTitle`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ title: t, adminPwd: ADMIN_PWD })
            });
            showMsg("已修改", true);
            renderVote();
        }

        async function resetVote() {
            if (!confirm("确定重置？")) return;
            await fetch(`${API_URL}/resetVote`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ adminPwd: ADMIN_PWD })
            });
            showMsg("已重置", true);
            renderVote();
        }

        function renderVoteResults(d) {
            const total = Object.values(d.votes).reduce((a,b)=>a+b,0);
            let html = `<h4>结果（总票：${total}）</h4>`;
            const sorted = d.options.map(p=>({...p, votes:d.votes[p.id]||0})).sort((a,b)=>b.votes-a.votes);
            sorted.forEach(p=>{
                const per = total>0 ? Math.round(p.votes/total*100) : 0;
                html+=`<div style="margin:8px 0;"><div style="display:flex;justify-content:space-between;"><span>${p.name}</span><span>${p.votes}票 ${per}%</span></div><div class="vote-bar"><div class="vote-progress" style="width:${per}%"></div></div></div>`;
            });
            document.getElementById("voteResults").innerHTML = html;
        }

        function adminLogin() {
            const p = document.getElementById("adminPwd").value.trim();
            if (p === ADMIN_PWD) {
                isAdminLoggedIn = true;
                document.getElementById("adminPanel").classList.remove("hide");
                showMsg("管理员登录成功", true);
                renderRegisteredPlayers();
                renderWaitPlayer();
                renderWaitGoal();
            } else {
                showMsg("密码错误", false);
            }
        }

        async function passPlayer(id) {
            await fetch(`${API_URL}/passPlayer?id=${id}`);
            showMsg("已通过", true);
            renderRegisteredPlayers();
            renderWaitPlayer();
            renderPlayerSelect();
        }

        async function rejectPlayer(id) {
            await fetch(`${API_URL}/rejectPlayer?id=${id}`);
            showMsg("已驳回", true);
            renderWaitPlayer();
        }

        async function deletePlayer(id) {
            if (!confirm("确定删除？数据不可恢复")) return;
            try {
                const res = await fetch(`${API_URL}/deletePlayer`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ id, adminPwd: ADMIN_PWD })
                });
                await res.json();
                showMsg("删除成功", true);
                renderRegisteredPlayers();
                renderWaitPlayer();
                renderPlayerSelect();
                renderRank();
            } catch (e) {
                showMsg("删除失败", false);
            }
        }

        async function revokePlayerApproval(id) {
            if (!confirm("确定撤销认证？")) return;
            try {
                const res = await fetch(`${API_URL}/revokePlayer`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ id, adminPwd: ADMIN_PWD })
                });
                await res.json();
                showMsg("已撤销", true);
                renderRegisteredPlayers();
                renderWaitPlayer();
                renderPlayerSelect();
            } catch {
                showMsg("失败", false);
            }
        }

        async function undoGoal() {
            if (!confirm("确定撤销最后一个进球？")) return;
            try {
                const res = await fetch(`${API_URL}/undoGoal`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ adminPwd: ADMIN_PWD })
                });
                const j = await res.json();
                if (j.success) {
                    showMsg("撤销成功", true);
                    renderRank();
                } else {
                    showMsg(j.error || "失败", false);
                }
            } catch {
                showMsg("请求失败", false);
            }
        }

        async function passGoal(id) {
            await fetch(`${API_URL}/passGoal?id=${id}`);
            showMsg("已通过", true);
            renderWaitGoal();
            renderRank();
        }

        async function rejectGoal(id) {
            await fetch(`${API_URL}/rejectGoal?id=${id}`);
            showMsg("已驳回", true);
            renderWaitGoal();
        }

        async function renderRegisteredPlayers() {
            try {
                const res = await fetch(`${API_URL}/allPlayers`);
                const list = await res.json();
                let html = list.length?"":"<p>暂无</p>";
                list.forEach(item=>{
                    const st = item.status==="approved"?"已认证":"待审核";
                    let bt = `<button class="btn-red" onclick="deletePlayer(${item.id})">删除</button>`;
                    if (item.status==="approved") {
                        bt = `<button class="btn-yellow" onclick="revokePlayerApproval(${item.id})">撤销认证</button>${bt}`;
                    }
                    html+=`<div style="padding:8px;border-bottom:1px solid #eee;">姓名：${item.name}｜密码：${item.password}｜进球：${item.totalGoals||0}｜场次：${item.totalMatches||0}｜状态：${st}<div style="margin-top:6px;">${bt}</div></div>`;
                });
                document.getElementById("registeredPlayersList").innerHTML = html;
            } catch {
                document.getElementById("registeredPlayersList").innerHTML = "<p>加载失败</p>";
            }
        }

        async function renderPlayerSelect() {
            try {
                const res = await fetch(`${API_URL}/players`);
                const list = await res.json();
                let html = `<option value="">请选择</option>`;
                list.forEach(i=>{
                    html+=`<option value="${i.id}">${i.name} 进球：${i.totalGoals||0}</option>`;
                });
                document.getElementById("playerSelect").innerHTML = html;
            } catch {
                document.getElementById("playerSelect").innerHTML = `<option value="">加载失败</option>`;
            }
        }

        async function renderWaitPlayer() {
            try {
                const res = await fetch(`${API_URL}/waitPlayers`);
                const list = await res.json();
                let html = list.length?"":"<p>暂无</p>";
                list.forEach(i=>{
                    html+=`<div style="padding:8px;border-bottom:1px solid #eee;">${i.name}<button class="btn-green" onclick="passPlayer(${i.id})">通过</button><button class="btn-red" onclick="rejectPlayer(${i.id})">驳回</button><button class="btn-red" onclick="deletePlayer(${i.id})">删除</button></div>`;
                });
                document.getElementById("waitPlayerList").innerHTML = html;
            } catch {
                document.getElementById("waitPlayerList").innerHTML = "<p>加载失败</p>";
            }
        }

        async function renderWaitGoal() {
            try {
                const res = await fetch(`${API_URL}/waitMatches`);
                const list = await res.json();
                let html = list.length?"":"<p>暂无</p>";
                list.forEach(i=>{
                    const t = new Date(i.time).toLocaleString();
                    html+=`<div style="padding:8px;border-bottom:1px solid #eee;">${i.pName}｜${i.goal}球｜${i.location}｜${t}<button class="btn-green" onclick="passGoal(${i.id})">通过</button><button class="btn-red" onclick="rejectGoal(${i.id})">驳回</button></div>`;
                });
                document.getElementById("waitGoalList").innerHTML = html;
            } catch {
                document.getElementById("waitGoalList").innerHTML = "<p>加载失败</p>";
            }
        }

        async function renderRank() {
            try {
                const res = await fetch(`${API_URL}/players`);
                const list = await res.json();
                list.sort((a,b)=>(b.totalGoals||0)-(a.totalGoals||0));
                let html = "<table><tr><th>排名</th><th>球员</th><th>进球</th><th>场次</th></tr>";
                list.forEach((it,i)=>{
                    if (!it.totalGoals) return;
                    let c = "";
                    if (i===0)c="rank-1";if(i===1)c="rank-2";if(i===2)c="rank-3";
                    html+=`<tr><td class="${c}">${i+1}</td><td>${it.name}</td><td>${it.totalGoals}</td><td>${it.totalMatches||0}</td></tr>`;
                });
                html+="</table>";
                document.getElementById("rankList").innerHTML = html;
            } catch {
                document.getElementById("rankList").innerHTML = "<p>加载失败</p>";
            }
        }
    </script>
</body>
</html>
