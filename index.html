<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>深🐔🥚坪山公园进球榜</title>
    <style>
        * {margin:0;padding:0;box-sizing:border-box;}
        body {font-family:Microsoft YaHei;background:#f2f3f5;padding:15px;}
        .wrap {max-width:850px;margin:0 auto;background:#fff;border-radius:10px;padding:20px;}
        h1 {text-align:center;margin-bottom:20px;color:#222;}
        .box {margin:15px 0;padding:15px;border:1px solid #eee;border-radius:8px;}
        input,select {width:100%;padding:10px;margin:6px 0;border:1px solid #ccc;border-radius:5px;font-size:16px;}
        button {padding:10px 16px;border:none;border-radius:5px;cursor:pointer;font-size:15px;margin:4px;}
        .btn-blue {background:#0066cc;color:#fff;}
        .btn-red {background:#dc3545;color:#fff;}
        .btn-green {background:#28a745;color:#fff;}
        .btn-gray {background:#6c757d;color:#fff;}
        .btn-yellow {background:#ffc107;color:#212521;}
        .hide {display:none !important;}
        .tip {color:#666;margin:8px 0;}
        .msg {padding:10px;border-radius:5px;margin:10px 0;text-align:center;display:none;}
        .success {background:#d4edda;color:#155724;display:block;}
        .error {background:#f8d7da;color:#721c24;display:block;}
        .nav {display:flex;justify-content:center;margin-bottom:20px;gap:10px;flex-wrap:wrap;}
        .nav button {padding:12px 24px;font-size:16px;}
        .nav .active {background:#0066cc;color:#fff;}
        .modal {position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);display:flex;justify-content:center;align-items:center;z-index:1000;}
        .modal-content {background:#fff;padding:25px;border-radius:10px;width:90%;max-width:400px;}
        .modal h3 {margin-bottom:15px;text-align:center;}
        .modal-buttons {display:flex;justify-content:flex-end;margin-top:15px;gap:10px;}
        table {width:100%;border-collapse:collapse;margin-top:10px;}
        th,td {padding:12px;text-align:left;border-bottom:1px solid #eee;}
        th {background:#f8f9fa;font-weight:bold;}
        .rank-1 {color:#ffc107;font-weight:bold;}
        .rank-2 {color:#6c757d;font-weight:bold;}
        .rank-3 {color:#cd7f32;font-weight:bold;}
        .vote-option {padding:10px;border:1px solid #eee;border-radius:5px;margin:8px 0;cursor:pointer;transition:all 0.2s;}
        .vote-option:hover {background:#f8f9fa;}
        .vote-option.selected {background:#0066cc;color:#fff;}
        .vote-bar {height:20px;background:#e9ecef;border-radius:10px;margin-top:5px;overflow:hidden;}
        .vote-progress {height:100%;background:#0066cc;transition:width 0.5s;}
    </style>
</head>
<body>
    <div class="wrap">
        <h1>⚽ 谁是深🐔🥚坪山公园球王？</h1>
        <div class="tip" style="text-align:center;color:#999;margin-bottom:20px;">当前：云端模式（数据永久保存）</div>
        
        <div class="nav">
            <button class="btn-blue active" onclick="showPage('main')">主界面</button>
            <button class="btn-gray" onclick="showPage('rank')">射手榜</button>
            <button class="btn-gray" onclick="showPage('vote')">投票</button>
            <button class="btn-gray" onclick="showPage('admin')">管理后台</button>
        </div>

        <div id="msgBox" class="msg"></div>

        <!-- 主界面 -->
        <div id="mainPage">
            <div class="box">
                <div class="tip">第一步：注册新球员（2位数字密码，不可重复）</div>
                <button class="btn-blue" onclick="openRegisterModal()">注册新球员</button>
            </div>
            <div class="box">
                <div class="tip">第二步：选择球员 → 选管理员设定的比赛时间 → 提交进球</div>
                <select id="playerSelect"><option value="">请选择已认证球员</option></select>
                <button class="btn-blue" onclick="openGoalModal()">提交进球记录</button>
            </div>
        </div>

        <!-- 射手榜 -->
        <div id="rankPage" class="hide">
            <div class="box"><h3>🏆 射手榜</h3><div id="rankList"></div></div>
        </div>

        <!-- 投票 -->
        <div id="votePage" class="hide">
            <div class="box">
                <h3 id="voteTitle">最佳球员投票</h3>
                <div id="adminVoteControls" class="hide">
                    <input type="text" id="newVoteTitle" placeholder="投票题目">
                    <button class="btn-yellow" onclick="setVoteTitle()">修改题目</button>
                    <button class="btn-red" onclick="resetVote()">重置投票</button>
                </div>
                <div id="voteOptions"></div>
                <div class="box"><input type="password" id="votePlayerPwd" placeholder="球员2位密码"><button class="btn-blue" onclick="submitVote()">投票</button></div>
                <div id="voteResults"></div>
            </div>
        </div>

        <!-- 管理后台 -->
        <div id="adminPage" class="hide">
            <div class="box">
                <input type="password" id="adminPwd" placeholder="管理员密码">
                <button class="btn-green" onclick="adminLogin()">登录</button>
            </div>

            <div id="adminPanel" class="hide">
                <!-- ✅ 管理员：比赛时间设置（你要的界面） -->
                <div class="box">
                    <h3>📅 管理员设置比赛时间（球员只能选这些）</h3>
                    <input type="datetime-local" id="matchTimeInput">
                    <button class="btn-green" onclick="addMatchTime()">添加时间</button>
                    <div id="matchTimeList" style="margin-top:10px;"></div>
                </div>

                <div class="box"><h3>已注册球员</h3><div id="registeredPlayersList"></div></div>
                <div class="box"><h3>待审核球员</h3><div id="waitPlayerList"></div></div>
                <div class="box"><h3>待审核进球</h3><div id="waitGoalList"></div></div>
                <div class="box"><h3>✅ 已通过进球（可撤销任意一条）</h3><div id="passedGoalsList"></div></div>
            </div>
        </div>
    </div>

    <!-- 注册弹窗 -->
    <div id="registerModal" class="modal hide">
        <div class="modal-content">
            <h3>注册球员</h3>
            <input type="text" id="registerName" placeholder="姓名">
            <input type="password" id="registerPwd" placeholder="2位数字密码" maxlength="2">
            <div class="modal-buttons">
                <button class="btn-gray" onclick="closeModal('registerModal')">取消</button>
                <button class="btn-blue" onclick="submitNewPlayer()">注册</button>
            </div>
        </div>
    </div>

    <!-- 提交进球弹窗（时间从管理员列表选） -->
    <div id="goalModal" class="modal hide">
        <div class="modal-content">
            <h3>提交进球</h3>
            <p id="selectedPlayerName"></p>
            <input type="password" id="playerPwd" placeholder="2位密码" maxlength="2">
            <input type="number" id="goalNum" min="1" value="1" placeholder="进球数">
            <input type="text" id="matchLocation" placeholder="地点">
            <select id="matchTimeSelect"></select>
            <div class="modal-buttons">
                <button class="btn-gray" onclick="closeModal('goalModal')">取消</button>
                <button class="btn-blue" onclick="submitGoalRecord()">提交</button>
            </div>
        </div>
    </div>

    <script>
        const ADMIN_PWD = "20041202";
        const API_URL = "https://footballpoint.top";
        let selectedPlayerId = "";
        let selectedVoteOption = null;
        let isAdminLoggedIn = false;

        window.onload = function () {
            renderPlayerSelect();
            loadMatchTimes();
        };

        function showMsg(text, isOk) {
            const box = document.getElementById("msgBox");
            box.innerText = text;
            box.className = isOk ? "success" : "error";
            setTimeout(() => box.className = "msg", 2500);
        }

        function showPage(pageName) {
            document.getElementById("mainPage").classList.add("hide");
            document.getElementById("rankPage").classList.add("hide");
            document.getElementById("votePage").classList.add("hide");
            document.getElementById("adminPage").classList.add("hide");
            document.querySelectorAll(".nav button").forEach(b=>b.className="btn-gray");
            event.target.className="btn-blue active";
            document.getElementById(pageName+"Page").classList.remove("hide");
            if(pageName==="rank")renderRank();
            if(pageName==="vote")renderVote();
            if(pageName==="admin"){
                renderRegisteredPlayers();renderWaitPlayer();renderWaitGoal();renderPassedGoals();renderMatchTimeList();
            }
        }

        function openRegisterModal(){closeModalAll();document.getElementById("registerModal").classList.remove("hide");}
        function openGoalModal(){
            selectedPlayerId = document.getElementById("playerSelect").value;
            if(!selectedPlayerId){showMsg("请选球员",false);return;}
            const name=document.getElementById("playerSelect").selectedOptions[0].text.split(" ")[0];
            document.getElementById("selectedPlayerName").innerText="球员："+name;
            loadMatchTimes();
            document.getElementById("goalModal").classList.remove("hide");
        }
        function closeModal(id){document.getElementById(id).classList.add("hide");}
        function closeModalAll(){document.querySelectorAll(".modal").forEach(m=>m.classList.add("hide"));}

        // ======================
        // 比赛时间（管理员设置）
        // ======================
        async function addMatchTime(){
            const t=document.getElementById("matchTimeInput").value;
            if(!t){showMsg("请选时间",false);return;}
            const r=await fetch(API_URL+"/setMatchTimes",{
                method:"POST",headers:{"Content-Type":"application/json"},
                body:JSON.stringify({adminPwd:ADMIN_PWD,time:t,action:"add"})
            });
            const j=await r.json();
            showMsg(j.success?"添加成功":j.error,j.success);
            renderMatchTimeList();
            loadMatchTimes();
        }
        async function removeMatchTime(t){
            const r=await fetch(API_URL+"/setMatchTimes",{
                method:"POST",headers:{"Content-Type":"application/json"},
                body:JSON.stringify({adminPwd:ADMIN_PWD,time:t,action:"remove"})
            });
            const j=await r.json();
            showMsg(j.success?"删除成功":j.error,j.success);
            renderMatchTimeList();
            loadMatchTimes();
        }
        async function loadMatchTimes(){
            const r=await fetch(API_URL+"/getMatchTimes");
            const list=await r.json();
            const sel=document.getElementById("matchTimeSelect");
            sel.innerHTML='<option value="">请选择比赛时间</option>';
            list.forEach(t=>{
                const s=new Date(t).toLocaleString();
                sel.innerHTML+=`<option value="${t}">${s}</option>`;
            });
        }
        async function renderMatchTimeList(){
            const r=await fetch(API_URL+"/getMatchTimes");
            const list=await r.json();
            const dom=document.getElementById("matchTimeList");
            let h="";
            list.forEach(t=>{
                const s=new Date(t).toLocaleString();
                h+=`<div style="padding:6px 0;">${s} <button class="btn-red" onclick="removeMatchTime('${t}')">删除</button></div>`;
            });
            dom.innerHTML=h||"<p>未设置时间</p>";
        }

        // ======================
        // 注册 2位密码不重复
        // ======================
        async function submitNewPlayer(){
            const n=document.getElementById("registerName").value.trim();
            const p=document.getElementById("registerPwd").value.trim();
            if(!n||p.length!=2||!/^\d\d$/.test(p)){showMsg("姓名+2位数字密码",false);return;}
            const r=await fetch(API_URL+"/addPlayer",{
                method:"POST",headers:{"Content-Type":"application/json"},
                body:JSON.stringify({name:n,password:p})
            });
            const j=await r.json();
            showMsg(j.success?"注册成功":j.error,j.success);
            if(j.success)closeModal("registerModal");
        }

        // ======================
        // 提交进球（只能选管理员时间）
        // ======================
        async function submitGoalRecord(){
            const pwd=document.getElementById("playerPwd").value.trim();
            const g=parseInt(document.getElementById("goalNum").value);
            const loc=document.getElementById("matchLocation").value.trim()||"未填写";
            const t=document.getElementById("matchTimeSelect").value;
            if(pwd.length!=2||!/^\d\d$/.test(pwd)){showMsg("2位密码",false);return;}
            if(!g||g<1||!t){showMsg("进球数+时间必填",false);return;}
            const r=await fetch(API_URL+"/addGoal",{
                method:"POST",headers:{"Content-Type":"application/json"},
                body:JSON.stringify({pid:selectedPlayerId,password:pwd,goal:g,location:loc,time:t})
            });
            const j=await r.json();
            showMsg(j.success?"提交成功":j.error,j.success);
            if(j.success)closeModal("goalModal");
        }

        // ======================
        // 投票
        // ======================
        async function renderVote(){
            const r=await fetch(API_URL+"/vote");
            const d=await r.json();
            document.getElementById("voteTitle").innerText=d.title;
            document.getElementById("adminVoteControls").classList.toggle("hide",!isAdminLoggedIn);
            let h="";d.options.forEach(o=>{h+=`<div class="vote-option" data-id="${o.id}" onclick="selectVoteOption(${o.id})">${o.name}</div>`;});
            document.getElementById("voteOptions").innerHTML=h;
            let total=Object.values(d.votes).reduce((a,b)=>a+b,0);
            let rs=`<h4>总票：${total}</h4>`;
            d.options.map(p=>({...p,v:d.votes[p.id]||0})).sort((a,b)=>b.v-a.v).forEach(x=>{
                const per=total?Math.round(x.v/total*100):0;
                rs+=`<div style="margin:6px 0;"><div style="display:flex;justify-content:space-between;"><span>${x.name}</span><span>${x.v}票 ${per}%</span></div><div class="vote-bar"><div class="vote-progress" style="width:${per}%"></div></div></div>`;
            });
            document.getElementById("voteResults").innerHTML=rs;
        }
        function selectVoteOption(id){
            document.querySelectorAll(".vote-option").forEach(o=>o.classList.remove("selected"));
            document.querySelector(`.vote-option[data-id="${id}"]`).classList.add("selected");
            selectedVoteOption=id;
        }
        async function submitVote(){
            if(!selectedVoteOption){showMsg("选候选人",false);return;}
            const p=document.getElementById("votePlayerPwd").value.trim();
            if(p.length!=2){showMsg("2位密码",false);return;}
            const r=await fetch(API_URL+"/vote",{
                method:"POST",headers:{"Content-Type":"application/json"},
                body:JSON.stringify({playerId:selectedVoteOption,password:p})
            });
            const j=await r.json();
            showMsg(j.success?"投票成功":j.error,j.success);
            if(j.success){document.getElementById("votePlayerPwd").value="";selectedVoteOption=null;renderVote();}
        }
        async function setVoteTitle(){
            const t=document.getElementById("newVoteTitle").value.trim();
            if(!t)return;
            await fetch(API_URL+"/setVoteTitle",{
                method:"POST",headers:{"Content-Type":"application/json"},
                body:JSON.stringify({title:t,adminPwd:ADMIN_PWD})
            });
            showMsg("已修改",true);renderVote();
        }
        async function resetVote(){
            if(!confirm("确定重置？"))return;
            await fetch(API_URL+"/resetVote",{
                method:"POST",headers:{"Content-Type":"application/json"},
                body:JSON.stringify({adminPwd:ADMIN_PWD})
            });
            showMsg("已重置",true);renderVote();
        }

        // ======================
        // 管理员功能
        // ======================
        function adminLogin(){
            const p=document.getElementById("adminPwd").value.trim();
            if(p===ADMIN_PWD){
                isAdminLoggedIn=true;
                document.getElementById("adminPanel").classList.remove("hide");
                showMsg("管理员登录成功",true);
                renderRegisteredPlayers();renderWaitPlayer();renderWaitGoal();renderPassedGoals();renderMatchTimeList();
            }else{showMsg("密码错误",false);}
        }
        async function passPlayer(id){await fetch(API_URL+"/passPlayer?id="+id);showMsg("通过",true);renderAll();}
        async function rejectPlayer(id){await fetch(API_URL+"/rejectPlayer?id="+id);showMsg("驳回",true);renderAll();}
        async function deletePlayer(id){
            if(!confirm("删除不可恢复"))return;
            await fetch(API_URL+"/deletePlayer",{
                method:"POST",headers:{"Content-Type":"application/json"},
                body:JSON.stringify({id,adminPwd:ADMIN_PWD})
            });
            showMsg("删除成功",true);renderAll();
        }
        async function revokePlayerApproval(id){
            if(!confirm("撤销认证"))return;
            await fetch(API_URL+"/revokePlayer",{
                method:"POST",headers:{"Content-Type":"application/json"},
                body:JSON.stringify({id,adminPwd:ADMIN_PWD})
            });
            showMsg("已撤销",true);renderAll();
        }
        // ✅ 撤销选定进球
        async function undoGoal(goalId){
            if(!confirm("撤销该进球？"))return;
            const r=await fetch(API_URL+"/undoGoal",{
                method:"POST",headers:{"Content-Type":"application/json"},
                body:JSON.stringify({goalId,adminPwd:ADMIN_PWD})
            });
            const j=await r.json();
            showMsg(j.success?"撤销成功":j.error,j.success);
            renderPassedGoals();renderRank();
        }
        async function passGoal(id){await fetch(API_URL+"/passGoal?id="+id);showMsg("通过",true);renderWaitGoal();renderPassedGoals();renderRank();}
        async function rejectGoal(id){await fetch(API_URL+"/rejectGoal?id="+id);showMsg("驳回",true);renderWaitGoal();}

        function renderAll(){renderRegisteredPlayers();renderWaitPlayer();renderWaitGoal();renderPassedGoals();renderPlayerSelect();renderRank();}

        async function renderRegisteredPlayers(){
            const r=await fetch(API_URL+"/allPlayers");
            const list=await r.json();
            let h=list.length?"":"<p>暂无</p>";
            list.forEach(it=>{
                const st=it.status==="approved"?"已认证":"待审核";
                let bt=`<button class="btn-red" onclick="deletePlayer(${it.id})">删除</button>`;
                if(it.status==="approved")bt=`<button class="btn-yellow" onclick="revokePlayerApproval(${it.id})">撤销认证</button>${bt}`;
                h+=`<div style="padding:8px;border-bottom:1px solid #eee;">${it.name}｜密码：${it.password}｜进球：${it.totalGoals||0}｜状态：${st}<div style="margin-top:6px;">${bt}</div></div>`;
            });
            document.getElementById("registeredPlayersList").innerHTML=h;
        }
        async function renderPlayerSelect(){
            const r=await fetch(API_URL+"/players");
            const list=await r.json();
            let h=`<option value="">请选择</option>`;
            list.forEach(it=>h+=`<option value="${it.id}">${it.name} 进球：${it.totalGoals||0}</option>`);
            document.getElementById("playerSelect").innerHTML=h;
        }
        async function renderWaitPlayer(){
            const r=await fetch(API_URL+"/waitPlayers");
            const list=await r.json();
            let h=list.length?"":"<p>暂无</p>";
            list.forEach(it=>{
                h+=`<div style="padding:8px;border-bottom:1px solid #eee;">${it.name}<button class="btn-green" onclick="passPlayer(${it.id})">通过</button><button class="btn-red" onclick="rejectPlayer(${it.id})">驳回</button><button class="btn-red" onclick="deletePlayer(${it.id})">删除</button></div>`;
            });
            document.getElementById("waitPlayerList").innerHTML=h;
        }
        async function renderWaitGoal(){
            const r=await fetch(API_URL+"/waitMatches");
            const list=await r.json();
            let h=list.length?"":"<p>暂无</p>";
            list.forEach(it=>{
                const t=new Date(it.time).toLocaleString();
                h+=`<div style="padding:8px;border-bottom:1px solid #eee;">${it.pName}｜${it.goal}球｜${it.location}｜${t}<button class="btn-green" onclick="passGoal(${it.id})">通过</button><button class="btn-red" onclick="rejectGoal(${it.id})">驳回</button></div>`;
            });
            document.getElementById("waitGoalList").innerHTML=h;
        }
        async function renderPassedGoals(){
            const r=await fetch(API_URL+"/");
            const data=await r.json();
            const list=data.matches||[];
            let h=list.length?"":"<p>暂无</p>";
            list.forEach(it=>{
                const t=new Date(it.time).toLocaleString();
                h+=`<div style="padding:8px;border-bottom:1px solid #eee;">${it.pName}｜${it.goal}球｜${it.location}｜${t}<button class="btn-red" onclick="undoGoal(${it.id})">撤销该进球</button></div>`;
            });
            document.getElementById("passedGoalsList").innerHTML=h;
        }
        async function renderRank(){
            const r=await fetch(API_URL+"/players");
            const list=await r.json();
            list.sort((a,b)=>(b.totalGoals||0)-(a.totalGoals||0));
            let h="<table><tr><th>排名</th><th>球员</th><th>进球</th><th>场次</th></tr>";
            list.forEach((it,i)=>{
                if(!it.totalGoals)return;
                let c="";
                if(i===0)c="rank-1";if(i===1)c="rank-2";if(i===2)c="rank-3";
                h+=`<tr><td class="${c}">${i+1}</td><td>${it.name}</td><td>${it.totalGoals}</td><td>${it.totalMatches||0}</td></tr>`;
            });
            h+="</table>";
            document.getElementById("rankList").innerHTML=h;
        }
    </script>
</body>
</html>
