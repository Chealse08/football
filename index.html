<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title id="pageTitle">深鸡蛋坪山公园球王榜</title>
<style>
* {margin:0; padding:0; box-sizing:border-box; font-family:"PingFang SC","Microsoft YaHei",sans-serif;}
body {background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height:100vh; padding:10px; color:#333;}
.wrap {max-width:100%; margin:0 auto; background:#fff; border-radius:16px; padding:15px; box-shadow:0 10px 30px rgba(0,0,0,0.2);}
h1 {text-align:center; margin-bottom:15px; font-size:22px; background: linear-gradient(90deg, #3b82f6, #10b981); -webkit-background-clip:text; -webkit-text-fill-color:transparent;}
.nav {display:grid; grid-template-columns: repeat(4, 1fr); gap:8px; margin-bottom:15px;}
.nav button {padding:10px 6px; font-size:12px; border:none; border-radius:10px; cursor:pointer; position:relative; transition:all 0.3s; font-weight:500;}
.nav .active {background: linear-gradient(135deg, #3b82f6, #1e40af); color:#fff; transform:translateY(-2px); box-shadow:0 4px 12px rgba(59,130,246,0.4);}
.nav .normal {background:#f1f5f9; color:#475569;}
.page {display:none;}
.page.active {display:block; animation:fadeIn 0.3s ease;}
@keyframes fadeIn { from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
.badge {position:absolute; top:-6px; right:-6px; background:#ef4444; color:#fff; width:18px; height:18px; line-height:18px; border-radius:50%; font-size:11px; text-align:center; font-weight:bold; box-shadow:0 2px 4px rgba(239,68,68,0.4);}
.hide {display:none !important;}
.box {padding:15px; border-radius:12px; margin:10px 0; background:#f8fafc; border-left:4px solid #3b82f6; box-shadow:0 2px 8px rgba(0,0,0,0.05);}
.box h3 {margin-bottom:10px; color:#1e293b; font-size:16px; display:flex; align-items:center; gap:6px;}
input, select, textarea {width:100%; padding:12px; margin:6px 0; border:1px solid #e2e8f0; border-radius:8px; font-size:14px;}
textarea {height:100px; resize:none;}
button {cursor:pointer; border:none; border-radius:8px; font-size:14px; font-weight:500; transition:all 0.3s;}
.btn-blue {background: linear-gradient(135deg, #3b82f6, #1e40af); color:#fff; padding:10px 16px; box-shadow:0 4px 12px rgba(59,130,246,0.3);}
.btn-green {background: linear-gradient(135deg, #10b981, #059669); color:#fff; padding:10px 16px; box-shadow:0 4px 12px rgba(16,185,129,0.3);}
.btn-red {background: linear-gradient(135deg, #ef4444, #dc2626); color:#fff; padding:10px 16px; box-shadow:0 4px 12px rgba(239,68,68,0.3);}
.btn-yellow {background: linear-gradient(135deg, #f59e0b, #d97706); color:#fff; padding:10px 16px; box-shadow:0 4px 12px rgba(245,158,11,0.3);}
.btn-gray {background: linear-gradient(135deg, #64748b, #475569); color:#fff; padding:10px 16px; box-shadow:0 4px 12px rgba(100,116,139,0.3);}
.tip {color:#64748b; margin:8px 0; font-size:13px;}
table {width:100%; border-collapse:collapse; margin-top:10px; font-size:13px;}
th,td {padding:8px; text-align:left; border-bottom:1px solid #e2e8f0;}
th {background:#f1f5f9; color:#475569; font-weight:600;}
.rank-1 {color:#f59e0b; font-weight:bold;}
.rank-2 {color:#64748b; font-weight:bold;}
.rank-3 {color:#cd7f32; font-weight:bold;}
.modal {position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); display:flex; justify-content:center; align-items:center; z-index:999;}
.modal-content {background:#fff; padding:20px; border-radius:16px; width:90%; max-width:350px; box-shadow:0 20px 60px rgba(0,0,0,0.3);}
.modal-content h3 {margin-bottom:15px; color:#1e293b; text-align:center;}
.btn-group {display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;}
.error-box {background:#fee2e2; border-left:4px solid #ef4444; padding:10px; border-radius:8px; margin:10px 0; color:#991b1b; font-size:12px;}
.match-info {background:#e0f2fe; border-left:4px solid #0ea5e9; padding:12px; border-radius:8px; margin-bottom:15px;}
.team-card {background:#f0fdf4; border-left:4px solid #22c55e; padding:12px; border-radius:8px; margin:10px 0;}
.team-card h4 {margin-bottom:8px; color:#166534;}
.member-tag {background:#dcfce7; color:#166534; padding:4px 8px; border-radius:4px; font-size:12px; display:inline-block; margin:2px;}
.captain-tag {background:#fef3c7; color:#92400e; font-weight:bold;}
/* 管理后台直接堆叠，不再需要 admin-nav 样式 */
</style>
</head>
<body>
<div class="wrap">
  <h1 id="mainTitle">⚽ 深鸡蛋坪山公园球王榜</h1>
  <div id="errorBox" class="error-box hide"></div>

  <!-- 顶部导航（主页面之间） -->
  <div class="nav">
    <button class="active" onclick="switchPage('main', event)">主界面</button>
    <button onclick="switchPage('rank', event)">射手榜</button>
    <button onclick="switchPage('team', event)">善意组队</button>
    <button onclick="switchPage('wechatImport', event)">接龙导入</button>
    <button onclick="switchPage('reward', event)">奖励规则</button>
    <button onclick="switchPage('vote', event)">投票</button>
    <button onclick="switchPage('admin', event)">管理后台 <span id="adminBadge" class="badge hide">0</span></button>
  </div>

  <!-- 主界面 -->
  <div id="main" class="page active">
    <div class="box">
      <h3>📝 注册球员</h3>
      <button class="btn-blue" onclick="openRegModal()">注册新球员</button>
    </div>
    <div class="box">
      <h3>⚽ 提交进球</h3>
      <select id="playerSelect"><option value="">请选择球员</option></select>
      <select id="matchTimeSelect"><option value="">选择比赛时间</option></select>
      <input type="number" id="goalCount" placeholder="进球数" min="1" value="1">
      <input type="password" id="goalPwdInput" placeholder="2位数字密码" maxlength="2">
      <button class="btn-blue" onclick="submitGoalFromMain()">提交进球</button>
    </div>
  </div>

  <!-- 射手榜 -->
  <div id="rank" class="page">
    <div class="box">
      <h3>🏆 射手榜</h3>
      <div id="rankList"></div>
    </div>
  </div>

  <!-- 善意组队 -->
  <div id="team" class="page">
    <div id="teamAuthBox" class="box">
      <h3>🔐 进入善意组队</h3>
      <select id="teamPlayerSelect"><option value="">选择你的球员</option></select>
      <input type="password" id="teamPlayerPwd" placeholder="2位数字密码" maxlength="2">
      <button class="btn-blue" onclick="loginToTeam()">进入</button>
    </div>
    <div id="teamMainBox" class="hide">
      <div id="currentMatchBox" class="match-info">
        <h3>⚽ 当前比赛</h3>
        <div id="matchInfoContent"></div>
      </div>
      <div class="box">
        <h3>📋 报名接龙 <span id="signCountTip"></span></h3>
        <div id="signList"></div>
        <div class="btn-group">
          <button class="btn-blue" onclick="signupMatch()">报名</button>
          <button class="btn-red" onclick="cancelSignup()">取消</button>
          <button class="btn-green" onclick="refreshTeamData()">刷新</button>
        </div>
      </div>
      <div class="box">
        <h3>👥 小队列表 <span id="teamCountTip"></span></h3>
        <div id="teamList"></div>
        <button class="btn-blue" onclick="openCreateTeamModal()">创建小队</button>
      </div>
      <div class="box">
        <h3>📨 我的申请</h3>
        <div id="myApplications"></div>
      </div>
      <div id="myTeamManageBox" class="box hide">
        <h3>🛠️ 我的小队管理</h3>
        <div id="myTeamManageContent"></div>
      </div>
    </div>
  </div>

  <!-- 接龙导入 -->
  <div id="wechatImport" class="page">
    <div class="box">
      <h3>📥 导入微信接龙</h3>
      <textarea id="wechatText" placeholder="粘贴接龙内容..."></textarea>
      <button class="btn-green" onclick="parseWechatSignup()">导入</button>
      <div id="importResult" class="tip" style="margin-top:10px;"></div>
    </div>
  </div>

  <!-- 奖励规则 -->
  <div id="reward" class="page">
    <div class="box">
      <h3>🏆 奖励规则</h3>
      <div id="rewardContent" style="white-space:pre-wrap;line-height:1.8;"></div>
    </div>
  </div>

  <!-- 投票 -->
  <div id="vote" class="page">
    <div class="box">
      <h3 id="voteTitle">最佳球员投票</h3>
      <div id="voteOptions"></div>
      <div style="margin-top:15px;">
        <select id="votePlayerSelect"><option value="">选择你的球员</option></select>
        <input type="password" id="votePwd" placeholder="2位数字密码" maxlength="2">
        <button class="btn-blue" onclick="submitVote()">投票</button>
      </div>
    </div>
  </div>

  <!-- ===================== 管理后台（改造：无导航，全部平铺） ===================== -->
  <div id="admin" class="page">
    <div class="box" id="adminLoginBox">
      <h3>🔑 管理员登录</h3>
      <input type="password" id="adminInputPwd" placeholder="输入管理员密码">
      <button class="btn-green" onclick="adminLogin()">登录</button>
    </div>
    <div id="adminMainBox" class="hide">
      <!-- 所有管理功能在此一次性展示，无需二级导航 -->
      <div class="box">
        <h3>⚽ 设置当前比赛</h3>
        <input type="datetime-local" id="adminMatchTime">
        <input type="text" id="adminMatchLocation" placeholder="比赛地点" value="坪山公园">
        <textarea id="adminMatchNote" placeholder="比赛备注（可选）"></textarea>
        <button class="btn-green" onclick="setCurrentMatch()">创建比赛</button>
        <button class="btn-red" onclick="closeCurrentMatch()">关闭比赛</button>
      </div>

      <div class="box">
        <h3>✏️ 修改网站标题</h3>
        <input type="text" id="siteTitleInput" placeholder="输入新标题">
        <button class="btn-blue" onclick="saveSiteTitle()">保存标题</button>
      </div>

      <div class="box">
        <h3>⏰ 比赛时间管理</h3>
        <input type="datetime-local" id="matchTimeInput">
        <button class="btn-green" onclick="addMatchTime()">添加时间</button>
        <div id="matchTimeList"></div>
      </div>

      <div class="box">
        <h3>📜 编辑奖励规则</h3>
        <textarea id="adminRewardInput"></textarea>
        <button class="btn-blue" onclick="saveRewardRules()">保存规则</button>
      </div>

      <div class="box">
        <h3>🗳️ 投票管理</h3>
        <input type="text" id="voteTitleInput" placeholder="修改投票标题">
        <button class="btn-blue" onclick="saveVoteTitle()">修改标题</button>
        <button class="btn-red" onclick="resetVote()" style="margin-top:10px;">重置投票</button>
      </div>

      <div class="box">
        <h3>👥 待审核球员 <span id="waitPlayerBadge" class="badge hide" style="position:relative; top:auto; right:auto; display:inline-block; margin-left:10px;">0</span></h3>
        <div id="waitPlayerList"></div>
      </div>

      <div class="box">
        <h3>⚽ 待审核进球 <span id="waitGoalBadge" class="badge hide" style="position:relative; top:auto; right:auto; display:inline-block; margin-left:10px;">0</span></h3>
        <div id="waitGoalList"></div>
      </div>

      <div class="box">
        <h3>👥 待审核小队 <span id="waitTeamBadge" class="badge hide" style="position:relative; top:auto; right:auto; display:inline-block; margin-left:10px;">0</span></h3>
        <div id="waitTeamList"></div>
      </div>

      <div class="box">
        <h3>👥 全部球员管理</h3>
        <div id="allPlayerList"></div>
      </div>

      <button class="btn-red" onclick="adminLogout()" style="margin-top:15px; width:100%;">退出管理后台</button>
    </div>
  </div>

</div>

<!-- 模态框（注册、消息、调整、小队） -->
<div id="regModal" class="modal hide">
  <div class="modal-content">
    <h3>📝 注册新球员</h3>
    <input type="text" id="regName" placeholder="姓名（不能重复）">
    <input type="password" id="regPwd" placeholder="2位数字密码" maxlength="2">
    <div class="btn-group" style="justify-content:flex-end;">
      <button class="btn-gray" onclick="closeRegModal()">取消</button>
      <button class="btn-blue" onclick="submitReg()">提交</button>
    </div>
  </div>
</div>

<div id="msgModal" class="modal hide">
  <div class="modal-content" style="text-align:center;">
    <p id="msgText" style="font-size:16px;margin-bottom:20px;"></p>
    <button class="btn-blue" onclick="closeMsgModal()">确定</button>
  </div>
</div>

<div id="adjustPlayerModal" class="modal hide">
  <div class="modal-content">
    <h3>📊 调整数据</h3>
    <p id="adjustPlayerName"></p>
    <input type="number" id="addGoalsInput" placeholder="增加进球" min="0" value="0">
    <input type="number" id="addMatchesInput" placeholder="增加场次" min="0" value="0">
    <div class="btn-group" style="justify-content:flex-end;">
      <button class="btn-gray" onclick="closeAdjustPlayerModal()">取消</button>
      <button class="btn-blue" onclick="submitAdjustPlayer()">确认</button>
    </div>
  </div>
</div>

<div id="createTeamModal" class="modal hide">
  <div class="modal-content">
    <h3>👥 创建小队</h3>
    <input type="text" id="teamNameInput" placeholder="小队名称">
    <input type="text" id="joinCodeInput" placeholder="4位进队码" maxlength="4">
    <div class="btn-group" style="justify-content:flex-end;">
      <button class="btn-gray" onclick="closeCreateTeamModal()">取消</button>
      <button class="btn-blue" onclick="submitCreateTeam()">创建</button>
    </div>
  </div>
</div>

<div id="joinTeamModal" class="modal hide">
  <div class="modal-content">
    <h3>🔑 加入小队</h3>
    <p id="joinTeamName"></p>
    <input type="text" id="joinTeamCodeInput" placeholder="进队码（可选）">
    <div class="btn-group" style="justify-content:flex-end;">
      <button class="btn-gray" onclick="closeJoinTeamModal()">取消</button>
      <button class="btn-blue" onclick="submitJoinTeam()">申请加入</button>
    </div>
  </div>
</div>

<script>
const API = "https://footballpoint.top";   // 改成你的 Worker 地址
const ADMIN_PWD = "20041202";
let currentPlayerId, currentPlayerPwd;
let currentJoinTeamId;
let currentAdjustPlayerId;
let playerCache = [];

window.onerror = function(msg, src, line) { showError("JS错误：" + msg + " 行：" + line); };

function showError(msg) { document.getElementById("errorBox").innerText=msg; document.getElementById("errorBox").classList.remove("hide"); }
function showMsg(txt){ document.getElementById("msgText").innerText=txt; document.getElementById("msgModal").classList.remove("hide"); }
function closeMsgModal(){ document.getElementById("msgModal").classList.add("hide"); }

// 顶级页面切换（主界面、射手榜、组队...）
function switchPage(pageId, evt){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.querySelectorAll(".nav button").forEach(b=>b.className="normal");
  document.getElementById(pageId).classList.add("active");
  evt.target.className="active";
  if(pageId==="rank") loadRankList();
  if(pageId==="admin") refreshAdminData();
  if(pageId==="team") loadTeamPlayerSelect();
  if(pageId==="reward") loadRewardRules();
  if(pageId==="vote") loadVoteInfo();
}

// 管理后台一次性加载所有数据
async function refreshAdminData(){
  refreshBadge();
  loadWaitPlayerList();
  loadWaitGoalList();
  loadWaitTeamList();
  loadAllPlayer();
  loadMatchTimeList();
  loadRewardRules();
}

// 模态框
function openRegModal(){ document.getElementById("regModal").classList.remove("hide"); }
function closeRegModal(){ document.getElementById("regModal").classList.add("hide"); }
function openCreateTeamModal(){ document.getElementById("createTeamModal").classList.remove("hide"); }
function closeCreateTeamModal(){ document.getElementById("createTeamModal").classList.add("hide"); }
function closeJoinTeamModal(){ document.getElementById("joinTeamModal").classList.add("hide"); }
function closeAdjustPlayerModal(){ document.getElementById("adjustPlayerModal").classList.add("hide"); }

// ========== 初始化 ==========
async function initMainPage(){
  const res = await fetch(API+"/getApprovedPlayer");
  const list = await res.json();
  let html = "<option value=''>请选择球员</option>";
  list.forEach(p => html += `<option value="${p.id}">${p.name}</option>`);
  document.getElementById("playerSelect").innerHTML = html;

  const tRes = await fetch(API+"/getGoalMatchTimes");
  const times = await tRes.json();
  let tHtml = "<option value=''>选择比赛时间</option>";
  times.forEach(t => tHtml += `<option value="${t}">${t}</option>`);
  document.getElementById("matchTimeSelect").innerHTML = tHtml;

  const tiRes = await fetch(API+"/getCustomTitle");
  const tiData = await tiRes.json();
  if(tiData.title){
    document.getElementById("pageTitle").innerText = tiData.title;
    document.getElementById("mainTitle").innerHTML = "⚽ " + tiData.title;
  }
  refreshBadge();
}

// 更新角标
async function refreshBadge(){
  const res = await fetch(API+"/getBadgeCount");
  const d = await res.json();
  const total = d.waitPlayer + d.waitGoal + d.waitTeam;
  const adminBadge = document.getElementById("adminBadge");
  if(total>0){ adminBadge.innerText = total; adminBadge.classList.remove("hide"); }
  else adminBadge.classList.add("hide");
  document.getElementById("waitPlayerBadge").innerText = d.waitPlayer||0;
  document.getElementById("waitGoalBadge").innerText = d.waitGoal||0;
  document.getElementById("waitTeamBadge").innerText = d.waitTeam||0;
}

// ========== 注册 ==========
async function submitReg(){
  const name = document.getElementById("regName").value.trim();
  const pwd = document.getElementById("regPwd").value.trim();
  if(!name || !pwd || pwd.length!==2 || !/^\d{2}$/.test(pwd)){ showMsg("请输入姓名和2位数字密码"); return; }
  const res = await fetch(API+"/regPlayer",{method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({name, pwd})});
  const d = await res.json();
  if(d.ok){ showMsg("注册已提交，等待审核"); closeRegModal(); initMainPage(); }
  else showMsg(d.msg || "注册失败");
}

// ========== 进球提交（需要密码） ==========
async function submitGoalFromMain(){
  const pid = document.getElementById("playerSelect").value;
  const time = document.getElementById("matchTimeSelect").value;
  const goal = parseInt(document.getElementById("goalCount").value);
  const pwd = document.getElementById("goalPwdInput").value.trim();
  if(!pid || !time || !pwd){ showMsg("请完整填写"); return; }
  const res = await fetch(API+"/addGoal",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({pid, password:pwd, goal, location:"坪山公园", time})
  });
  const d = await res.json();
  if(d.success){ showMsg("进球已提交"); document.getElementById("goalCount").value=1; document.getElementById("goalPwdInput").value=""; }
  else showMsg(d.error || "提交失败");
}

// ========== 射手榜 ==========
async function loadRankList(){
  const res = await fetch(API+"/getApprovedPlayer");
  const list = await res.json();
  list.sort((a,b)=>(b.totalGoals||0)-(a.totalGoals||0));
  let html = "<table><tr><th>排名</th><th>姓名</th><th>进球</th><th>场次</th></tr>";
  list.forEach((p,idx)=>{
    let cls = idx===0?"rank-1":(idx===1?"rank-2":(idx===2?"rank-3":""));
    html += `<tr><td class="${cls}">${idx+1}</td><td>${p.name}</td><td>${p.totalGoals||0}</td><td>${p.totalMatches||0}</td></tr>`;
  });
  html += "</table>";
  document.getElementById("rankList").innerHTML = html;
}

// ========== 善意组队 ==========
async function loadTeamPlayerSelect(){
  const res = await fetch(API+"/getAllPlayer");
  const list = await res.json();
  playerCache = list;
  let html = "<option value=''>选择你的球员</option>";
  list.filter(p=>p.status==="approved").forEach(p=>html+=`<option value="${p.id}">${p.name}</option>`);
  document.getElementById("teamPlayerSelect").innerHTML = html;
}
async function loginToTeam(){
  const pid = document.getElementById("teamPlayerSelect").value;
  const pwd = document.getElementById("teamPlayerPwd").value;
  const res = await fetch(API+"/checkPlayerAuth",{method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({pid,pwd})});
  const d = await res.json();
  if(d.ok){
    currentPlayerId = pid; currentPlayerPwd = pwd;
    document.getElementById("teamAuthBox").classList.add("hide");
    document.getElementById("teamMainBox").classList.remove("hide");
    refreshTeamData();
  } else showMsg("验证失败");
}
async function refreshTeamData(){ await loadCurrentMatch(); await loadSignupList(); await loadTeamList(); await loadMyStatus(); }
async function loadCurrentMatch(){
  const res = await fetch(API+"/getCurrentMatch");
  const match = await res.json();
  document.getElementById("matchInfoContent").innerHTML = (!match || match.status!=="open") ? "<p>暂无比赛</p>" : `<p>时间：${match.time}</p><p>地点：${match.location||""}</p><p>备注：${match.note||""}</p>`;
}
async function loadSignupList(){
  const res = await fetch(API+"/getSignupList");
  const list = await res.json();
  document.getElementById("signCountTip").innerText = `(${list.length}/27)`;
  document.getElementById("signList").innerHTML = list.map(p=>`<span class="member-tag">${p.name}</span>`).join("") || "暂无";
}
async function loadTeamList(){
  const res = await fetch(API+"/getApprovedTeams");
  const teams = (await res.json()).teams||[];
  document.getElementById("teamCountTip").innerText = `(${teams.length})`;
  let html = "";
  teams.forEach(t=>{
    html += `<div class="team-card"><h4>${t.name}</h4><p>队长：${playerCache.find(p=>p.id==t.captainId)?.name||"未知"}</p>
    <div>${t.members.map(id=>`<span class="member-tag${id==t.captainId?' captain-tag':''}">${playerCache.find(p=>p.id==id)?.name||"未知"}</span>`).join("")}</div>
    <button class="btn-blue" onclick="openJoinTeamModal(${t.id},'${t.name}')">申请加入</button></div>`;
  });
  document.getElementById("teamList").innerHTML = html || "暂无小队";
}
function openJoinTeamModal(teamId, teamName){
  currentJoinTeamId = teamId;
  document.getElementById("joinTeamName").innerText = "加入 " + teamName;
  document.getElementById("joinTeamModal").classList.remove("hide");
}
async function submitJoinTeam(){
  const code = document.getElementById("joinTeamCodeInput").value.trim();
  let res;
  if(code) res = await fetch(API+"/joinTeamByCode",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({playerId:currentPlayerId,password:currentPlayerPwd,teamId:currentJoinTeamId,joinCode:code})});
  else res = await fetch(API+"/applyJoinTeam",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({playerId:currentPlayerId,password:currentPlayerPwd,teamId:currentJoinTeamId})});
  const d = await res.json();
  showMsg(d.success?"操作成功":(d.error||"失败"));
  closeJoinTeamModal();
  refreshTeamData();
}
async function signupMatch(){
  const res = await fetch(API+"/signupMatch",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({playerId:currentPlayerId,password:currentPlayerPwd})});
  const d = await res.json();
  showMsg(d.success?"报名成功":(d.error||"失败"));
  refreshTeamData();
}
async function cancelSignup(){
  const res = await fetch(API+"/cancelSignup",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({playerId:currentPlayerId,password:currentPlayerPwd})});
  const d = await res.json();
  showMsg(d.success?"已取消":(d.error||"失败"));
  refreshTeamData();
}
async function loadMyStatus(){
  const res = await fetch(API+"/getMyTeamStatus",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({playerId:currentPlayerId,password:currentPlayerPwd})});
  const d = await res.json();
  document.getElementById("myApplications").innerHTML = (d.myApplications||[]).map(a=>`<p>${a.teamName} (审核中)</p>`).join("")||"无";
  if((d.myTeams||[]).length){
    document.getElementById("myTeamManageBox").classList.remove("hide");
    let html = "";
    d.myTeams.forEach(t=>{
      html += `<div class="team-card"><h4>${t.name}</h4><p>成员：${t.members.map(id=>playerCache.find(p=>p.id==id)?.name||"未知").join(", ")}</p>`;
      if(t.isCaptain){
        html += "<p>待申请：";
        (t.pending||[]).forEach(pid=>{
          let p = playerCache.find(x=>x.id==pid);
          html += `<span class="member-tag">${p?p.name:'未知'} <button class="btn-green" onclick="handleTeamApply(${t.id},${pid},'approve')">✓</button><button class="btn-red" onclick="handleTeamApply(${t.id},${pid},'reject')">✗</button></span>`;
        });
        html += "</p>";
      }
      html += "</div>";
    });
    document.getElementById("myTeamManageContent").innerHTML = html;
  } else document.getElementById("myTeamManageBox").classList.add("hide");
}
async function handleTeamApply(teamId, playerId, action){
  const res = await fetch(API+"/handleTeamApply",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({captainId:currentPlayerId,password:currentPlayerPwd,teamId,playerId,action})});
  const d = await res.json();
  showMsg(d.success?"操作成功":(d.error||"失败"));
  refreshTeamData();
}
async function submitCreateTeam(){
  const name = document.getElementById("teamNameInput").value.trim();
  const code = document.getElementById("joinCodeInput").value.trim();
  if(!name || !code || code.length!==4){ showMsg("请输入名称和4位码"); return; }
  const res = await fetch(API+"/createTeam",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({captainId:currentPlayerId,password:currentPlayerPwd,teamName:name,joinCode:code})});
  const d = await res.json();
  if(d.success){ showMsg("创建成功"); closeCreateTeamModal(); refreshTeamData(); }
  else showMsg(d.error||"失败");
}

// ========== 接龙导入 ==========
function parseWechatSignup(){
  const text = document.getElementById("wechatText").value.trim();
  if(!text) return showMsg("请粘贴内容");
  const names = [...new Set(text.match(/[\u4e00-\u9fff]{2,4}/g)||[])];
  if(!names.length) return showMsg("未识别姓名");
  doBatchImport(names);
}
async function doBatchImport(names){
  const res = await fetch(API+"/batchWechatImport",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({names})});
  const d = await res.json();
  document.getElementById("importResult").innerText = `导入：新增${d.add||0}人，已存在${d.exist||0}人`;
  document.getElementById("wechatText").value = "";
}

// ========== 奖励规则 ==========
async function loadRewardRules(){
  const res = await fetch(API+"/getRewardRules");
  const d = await res.json();
  document.getElementById("rewardContent").innerText = d.content||"";
  if(document.getElementById("adminRewardInput")) document.getElementById("adminRewardInput").value = d.content||"";
}

// ========== 投票 ==========
async function loadVoteInfo(){
  const res = await fetch(API+"/getVoteInfo");
  const d = await res.json();
  document.getElementById("voteTitle").innerText = d.title||"最佳球员投票";
  document.getElementById("voteOptions").innerHTML = (d.options||[]).map(opt=>`<div class="member-tag">${opt.name} ${d.results[opt.id]||0}票</div>`).join("")||"暂无选项";
  const plRes = await fetch(API+"/getApprovedPlayer");
  const pl = await plRes.json();
  document.getElementById("votePlayerSelect").innerHTML = "<option value=''>选择你的球员</option>" + pl.map(p=>`<option value="${p.id}">${p.name}</option>`).join("");
}
async function submitVote(){
  const pid = document.getElementById("votePlayerSelect").value;
  const pwd = document.getElementById("votePwd").value;
  if(!pid||!pwd) return showMsg("请选择球员并输入密码");
  const res = await fetch(API+"/submitVote",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({playerId:pid, password:pwd})});
  const d = await res.json();
  if(d.success){ showMsg("投票成功"); loadVoteInfo(); }
  else showMsg(d.error||"失败");
}
async function resetVote(){
  const res = await fetch(API+"/resetVote",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({adminPwd:ADMIN_PWD})});
  const d = await res.json();
  showMsg(d.success?"已重置":"重置失败");
  loadVoteInfo();
}
async function saveVoteTitle(){
  const title = document.getElementById("voteTitleInput").value.trim();
  if(!title) return showMsg("输入标题");
  const res = await fetch(API+"/setVoteTitle",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({adminPwd:ADMIN_PWD, title})});
  const d = await res.json();
  showMsg(d.success?"标题已更新":"更新失败");
  if(d.success){ document.getElementById("voteTitleInput").value=""; loadVoteInfo(); }
}

// ========== 管理后台（平铺版） ==========
let isAdminLoggedIn = false;
function adminLogin(){
  if(document.getElementById("adminInputPwd").value===ADMIN_PWD){
    isAdminLoggedIn = true;
    document.getElementById("adminLoginBox").classList.add("hide");
    document.getElementById("adminMainBox").classList.remove("hide");
    refreshAdminData(); // 一次性加载所有管理数据
  } else showMsg("密码错误");
}
function adminLogout(){
  isAdminLoggedIn = false;
  document.getElementById("adminMainBox").classList.add("hide");
  document.getElementById("adminLoginBox").classList.remove("hide");
}
async function setCurrentMatch(){
  const time = document.getElementById("adminMatchTime").value;
  const location = document.getElementById("adminMatchLocation").value;
  const note = document.getElementById("adminMatchNote").value;
  if(!time) return showMsg("请选择时间");
  const res = await fetch(API+"/setCurrentMatch",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({adminPwd:ADMIN_PWD, time, location, note})});
  const d = await res.json();
  showMsg(d.success?"比赛已创建":"创建失败");
}
async function closeCurrentMatch(){
  const res = await fetch(API+"/closeCurrentMatch",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({adminPwd:ADMIN_PWD})});
  showMsg((await res.json()).success?"已关闭":"失败");
}
async function saveSiteTitle(){
  const title = document.getElementById("siteTitleInput").value.trim();
  if(!title) return showMsg("输入标题");
  const res = await fetch(API+"/setCustomTitle",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({title,adminPwd:ADMIN_PWD})});
  if((await res.json()).success){
    document.getElementById("pageTitle").innerText = title;
    document.getElementById("mainTitle").innerHTML = "⚽ " + title;
    showMsg("标题已更新");
  }
}
async function addMatchTime(){
  const time = document.getElementById("matchTimeInput").value;
  if(!time) return;
  await fetch(API+"/setGoalMatchTimes",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({adminPwd:ADMIN_PWD,action:"add",time})});
  loadMatchTimeList();
}
async function removeMatchTime(time){
  await fetch(API+"/setGoalMatchTimes",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({adminPwd:ADMIN_PWD,action:"remove",time})});
  loadMatchTimeList();
}
async function loadMatchTimeList(){
  const res = await fetch(API+"/getGoalMatchTimes");
  const times = await res.json();
  document.getElementById("matchTimeList").innerHTML = times.map(t=>`<p>${t} <button class="btn-red" onclick="removeMatchTime('${t}')">删除</button></p>`).join("")||"无";
}
async function saveRewardRules(){
  const content = document.getElementById("adminRewardInput").value;
  await fetch(API+"/setRewardRules",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({content,adminPwd:ADMIN_PWD})});
  showMsg("已保存");
}
// ---- 待审核球员 ----
async function loadWaitPlayerList(){
  const res = await fetch(API+"/getAllPlayer");
  const list = (await res.json()).filter(p=>p.status==="pending");
  document.getElementById("waitPlayerList").innerHTML = list.map(p=>`<p>${p.name} <button class="btn-blue" onclick="operatePlayer(${p.id},'pass')">通过</button><button class="btn-red" onclick="operatePlayer(${p.id},'reject')">拒绝</button></p>`).join("")||"无待审球员";
}
// ---- 待审进球 ----
async function loadWaitGoalList(){
  const res = await fetch(API+"/getWaitGoals");
  const list = await res.json();
  document.getElementById("waitGoalList").innerHTML = list.map(g=>`<p>${g.pName} 进${g.goal}球 ${g.time} <button class="btn-blue" onclick="passGoal(${g.id})">通过</button><button class="btn-red" onclick="rejectGoal(${g.id})">拒绝</button></p>`).join("")||"无待审进球";
}
async function passGoal(id){ await fetch(API+"/passGoal?id="+id); showMsg("已通过"); loadWaitGoalList(); }
async function rejectGoal(id){ await fetch(API+"/rejectGoal?id="+id); showMsg("已拒绝"); loadWaitGoalList(); }
// ---- 待审小队 ----
async function loadWaitTeamList(){
  const res = await fetch(API+"/getPendingTeams");
  const teams = (await res.json()).teams||[];
  document.getElementById("waitTeamList").innerHTML = teams.map(t=>`<p>${t.name} <button class="btn-blue" onclick="approveTeam(${t.id})">通过</button><button class="btn-red" onclick="rejectTeam(${t.id})">拒绝</button></p>`).join("")||"无待审小队";
}
async function approveTeam(id){ await fetch(API+"/approveTeam",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({teamId:id,adminPwd:ADMIN_PWD})}); showMsg("已通过"); loadWaitTeamList(); }
async function rejectTeam(id){ await fetch(API+"/rejectTeam",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({teamId:id,adminPwd:ADMIN_PWD})}); showMsg("已拒绝"); loadWaitTeamList(); }
// ---- 全部球员管理 ----
async function loadAllPlayer(){
  const res = await fetch(API+"/getAllPlayer");
  const list = await res.json();
  let html = `<table><tr><th>姓名</th><th>状态</th><th>进球</th><th>场次</th><th>操作</th></tr>`;
  list.forEach(p=>{
    html += `<tr><td>${p.name}</td><td>${p.status}</td><td>${p.totalGoals||0}</td><td>${p.totalMatches||0}</td><td>
      ${p.status==="pending"?`<button class="btn-blue" onclick="operatePlayer(${p.id},'pass')">通过</button><button class="btn-red" onclick="operatePlayer(${p.id},'reject')">拒绝</button>`:""}
      ${p.status==="approved"?`<button class="btn-red" onclick="operatePlayer(${p.id},'cancel')">注销</button>`:""}
      <button class="btn-yellow" onclick="openAdjustModal(${p.id},'${p.name}')">调整</button>
      <button class="btn-red" onclick="deletePlayer(${p.id})">删除</button>
    </td></tr>`;
  });
  html += "</table>";
  document.getElementById("allPlayerList").innerHTML = html;
}
async function operatePlayer(id, type){
  await fetch(API+"/operatePlayer",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id,type,adminPwd:ADMIN_PWD})});
  loadAllPlayer(); loadWaitPlayerList();
}
function openAdjustModal(id, name){
  currentAdjustPlayerId = id;
  document.getElementById("adjustPlayerName").innerText = "调整 " + name;
  document.getElementById("addGoalsInput").value=0;
  document.getElementById("addMatchesInput").value=0;
  document.getElementById("adjustPlayerModal").classList.remove("hide");
}
async function submitAdjustPlayer(){
  const addGoals = parseInt(document.getElementById("addGoalsInput").value)||0;
  const addMatches = parseInt(document.getElementById("addMatchesInput").value)||0;
  await fetch(API+"/adjustPlayerData",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({adminPwd:ADMIN_PWD,playerId:currentAdjustPlayerId,addGoals,addMatches})});
  showMsg("调整成功");
  closeAdjustPlayerModal();
  loadAllPlayer();
}
// ---- 删除球员（修复：确认后直接调用后端） ----
async function deletePlayer(playerId){
  if(!confirm("彻底删除该球员？")) return;
  const res = await fetch(API+"/deletePlayer",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({playerId, adminPwd:ADMIN_PWD})
  });
  const d = await res.json();
  if(d.success){ showMsg("已删除"); loadAllPlayer(); loadWaitPlayerList(); }
  else showMsg("删除失败：" + (d.error||"未知错误"));
}

// 启动
window.addEventListener("load", ()=>{ initMainPage(); setInterval(refreshBadge, 30000); });
