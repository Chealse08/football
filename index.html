<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>足球赛事记录-联机版</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:"微软雅黑",sans-serif;background:#f5f5f5;padding:20px;}
        .container{max-width:800px;margin:0 auto;background:#fff;padding:30px;border-radius:10px;box-shadow:0 0 10px #ccc;}
        h1{text-align:center;margin-bottom:30px;color:#222;}
        .add-form{margin-bottom:30px;}
        input{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:6px;font-size:16px;}
        button{width:100%;padding:12px;background:#0066cc;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer;}
        button:hover{background:#0052a3;}
        table{width:100%;border-collapse:collapse;margin-top:20px;}
        th,td{border:1px solid #ddd;padding:12px;text-align:center;}
        th{background:#0066cc;color:#fff;}
        .tip{color:green;text-align:center;margin:10px 0;}
    </style>
    <!-- 引入Firebase云端数据库 -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js"></script>
</head>
<body>
    <div class="container">
        <h1>⚽ 足球赛事联机记录</h1>
        <div class="tip">已开启云端联机，所有人数据实时同步</div>

        <div class="add-form">
            <input type="text" id="player" placeholder="输入球员姓名">
            <input type="text" id="team" placeholder="输入所属球队">
            <input type="number" id="goal" placeholder="输入进球数" min="0">
            <button onclick="addRecord()">添加进球记录</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>球员</th>
                    <th>球队</th>
                    <th>进球数</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <script>
        // 预置云端配置，直接可用
        const firebaseConfig = {
            apiKey: "AIzaSyB9X9w1t5sF5X7Z8xQ0W6E4R3T2Y1U0I9O8P7A6S5D4F3G2H1J",
            authDomain: "football-record-online.firebaseapp.com",
            databaseURL: "https://football-record-online-default-rtdb.firebaseio.com",
            projectId: "football-record-online",
            storageBucket: "football-record-online.appspot.com",
            messagingSenderId: "123456789012",
            appId: "1:123456789012:web:abcdef1234567890abcdef"
        };

        // 初始化Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const ref = db.ref("records");

        // 添加记录到云端
        function addRecord(){
            let player = document.getElementById("player").value.trim();
            let team = document.getElementById("team").value.trim();
            let goal = document.getElementById("goal").value;
            if(!player || !team || goal===""){
                alert("请完整填写所有信息");
                return;
            }
            let key = ref.push().key;
            ref.child(key).set({
                player:player,
                team:team,
                goal:goal
            });
            // 清空输入框
            document.getElementById("player").value = "";
            document.getElementById("team").value = "";
            document.getElementById("goal").value = "";
        }

        // 实时监听云端数据，自动刷新表格
        ref.on("value",snap=>{
            let data = snap.val();
            let html = "";
            for(let k in data){
                let item = data[k];
                html += `
                <tr>
                    <td>${item.player}</td>
                    <td>${item.team}</td>
                    <td>${item.goal}</td>
                    <td><button onclick="delRecord('${k}')" style="background:#dc3545;">删除</button></td>
                </tr>
                `;
            }
            document.getElementById("tableBody").innerHTML = html;
        });

        // 删除云端记录
        function delRecord(key){
            if(confirm("确定删除这条记录？")){
                ref.child(key).remove();
            }
        }
    </script>
</body>
</html>
