<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">深鸡蛋坪山公园球王榜</title>
    <style>
        * {margin:0; padding:0; box-sizing:border-box; font-family:Microsoft YaHei;}
        body {background:#f2f3f5; padding:15px;}
        .wrap {max-width:900px; margin:0 auto; background:#fff; border-radius:10px; padding:20px;}
        h1 {text-align:center; margin-bottom:20px; color:#222;}

        .nav {display:flex; justify-content:center; gap:6px; margin-bottom:20px; flex-wrap:wrap;}
        .nav button {padding:10px 8px; font-size:13px; min-width:70px; border:none; border-radius:6px; cursor:pointer; position:relative;}
        .nav .active {background:#0066cc; color:#fff;}
        .nav .normal {background:#6c757d; color:#fff;}

        .page {display:none;}
        .page.active {display:block;}

        .admin-nav {display:flex; justify-content:center; gap:6px; margin-bottom:15px; flex-wrap:wrap;}
        .admin-nav button {padding:9px 8px; font-size:13px; border:none; border-radius:6px; cursor:pointer;}
        .admin-page {display:none;}
        .admin-page.active {display:block;}

        .badge {position:absolute; top:-6px; right:-6px; background:#dc3545; color:#fff;
        width:18px; height:18px; line-height:18px; border-radius:50%; font-size:12px; text-align:center;}
        .hide {display:none !important;}

        .box {padding:15px; border:1px solid #eee; border-radius:8px; margin:10px 0;}
        input, select, textarea {width:100%; padding:10px; margin:6px 0; border:1px solid #ccc; border-radius:6px;}
        textarea {height:180px;resize:vertical;}
        button {cursor:pointer;}
        .btn-blue {background:#0066cc; color:#fff;}
        .btn-green {background:#28a745; color:#fff;}
        .btn-red {background:#dc3545; color:#fff;}
        .btn-gray {background:#6c757d; color:#fff;}
        .btn-yellow {background:#ffc107;color:#222;}
        .tip {color:#666; margin:8px 0;}

        table {width:100%; border-collapse:collapse; margin-top:10px;}
        th,td {padding:12px; text-align:left; border-bottom:1px solid #eee;}
        th {background:#f8f9fa;}
        .rank-1 {color:#ffc107; font-weight:bold;}
        .rank-2 {color:#6c757d; font-weight:bold;}
        .rank-3 {color:#cd7f32; font-weight:bold;}

        .modal {position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5);
        display:flex; justify-content:center; align-items:center; z-index:999;}
        .modal-content {background:#fff; padding:25px; border-radius:10px; width:90%; max-width:400px;}
    </style>
</head>
<body>
<div class="wrap">
    <h1 id="mainTitle">⚽ 深鸡蛋坪山公园球王榜</h1>

    <div class="nav">
        <button class="active" onclick="switchPage('main')">主界面</button>
        <button onclick="switchPage('rank')">射手榜</button>
        <button onclick="switchPage('team')">善意组队</button>
        <button onclick="switchPage('wechatImport')">微信接龙导入</button>
        <button onclick="switchPage('reward')">奖励规则</button>
        <button onclick="switchPage('vote')">投票</button>
        <button onclick="switchPage('admin')">
            管理后台
            <span id="adminBadge" class="badge hide">0</span>
        </button>
    </div>

    <div id="main" class="page active">
        <div class="box">
            <p class="tip">注册球员（2位数字密码，已拒绝/注销密码可复用）</p>
            <button class="btn-blue" onclick="openRegModal()">注册新球员</button>
        </div>
        <div class="box">
            <p class="tip">仅已审核通过球员可提交进球</p>
            <select id="playerSelect"><option value="">请选择已认证球员</option></select>
            <button class="btn-blue" onclick="openGoalModal()">提交进球</button>
        </div>
    </div>

    <div id="rank" class="page">
        <div class="box">
            <h3>🏆 射手榜</h3>
            <div id="rankList"></div>
        </div>
    </div>

    <div id="team" class="page">
        <div id="teamAuthBox" class="box">
            <h3>🔐 进入善意组队</h3>
            <p class="tip">方式1：球员身份验证</p>
            <select id="teamSelPlayer"><option value="">选择你的球员</option></select>
            <input type="password" id="teamSelPwd" placeholder="2位数字密码" maxlength="2">
            <button class="btn-blue" onclick="checkTeamAuth()">球员登录进入</button>

            <p class="tip" style="margin-top:15px;">方式2：管理员直接进入</p>
            <input type="password" id="teamAdminPwd" placeholder="输入管理员密码">
            <button class="btn-yellow" onclick="adminEnterTeam()">管理员直接进入</button>
        </div>
        <div id="teamMainBox" class="hide">
            <div class="box">
                <h3>📋 报名接龙 <span id="signCountTip"></span></h3>
                <div id="signList"></div>
                <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;">
                    <button class="btn-blue" onclick="exportWechatSignup()">导出微信接龙格式</button>
                    <button class="btn-green" onclick="refreshSignList()">刷新列表</button>
                </div>
            </div>
            <div class="box"><h3>👥 小队列表</h3><div id="teamList"></div></div>
        </div>
    </div>

    <div id="wechatImport" class="page">
        <div class="box">
            <h3>📥 导入微信接龙</h3>
            <p class="tip">复制微信群里的接龙整段内容，粘贴到下方，自动解析姓名、批量注册并自动报名</p>
            <textarea id="wechatText" placeholder="粘贴微信接龙内容在这里..."></textarea>
            <button class="btn-green" onclick="parseWechatSignup()">开始解析并导入</button>
            <div id="importResult" class="tip" style="margin-top:10px;"></div>
        </div>
    </div>

    <div id="reward" class="page">
        <div class="box">
            <h3>🏆 奖励规则</h3>
            <div id="rewardTxt">1. 赛季进球第一奖励定制球衣\n2. 积极参与球员日常优先组队</div>
        </div>
    </div>

    <div id="vote" class="page">
        <div class="box">
            <h3>最佳球员投票</h3>
            <p>投票功能后续开放</p>
        </div>
    </div>

    <div id="admin" class="page">
        <div class="box" id="adminLoginBox">
            <input type="password" id="adminInputPwd" placeholder="输入管理员密码">
            <button class="btn-green" onclick="adminLogin()">登录管理后台</button>
        </div>

        <div id="adminMainBox" class="hide">
            <div class="admin-nav">
                <button class="active" onclick="switchAdminPage('title')">修改标题</button>
                <button onclick="switchAdminPage('time')">时间管理</button>
                <button onclick="switchAdminPage('allPlayer')">全部球员</button>
                <button onclick="switchAdminPage('waitPlayer')">
                    待审球员
                    <span id="waitPlayerBadge" class="badge hide">0</span>
                </button>
                <button onclick="switchAdminPage('waitGoal')">
                    待审进球
                    <span id="waitGoalBadge" class="badge hide">0</span>
                </button>
                <button onclick="switchAdminPage('waitTeam')">
                    待审小队
                    <span id="waitTeamBadge" class="badge hide">0</span>
                </button>
                <button class="btn-red" onclick="adminLogout()">退出</button>
            </div>

            <div id="admin-title" class="admin-page active">
                <div class="box">
                    <input type="text" id="siteTitleInput" placeholder="输入网站新标题">
                    <button class="btn-blue" onclick="saveSiteTitle()">保存标题</button>
                </div>
            </div>
            <div id="admin-time" class="admin-page">
                <div class="box">
                    <input type="datetime-local" id="matchTimeInput">
                    <button class="btn-green" onclick="addMatchTime()">添加比赛时间</button>
                    <div id="matchTimeList"></div>
                </div>
            </div>
            <div id="admin-allPlayer" class="admin-page">
                <div class="box"><h3>全部球员（可通过/拒绝/注销）</h3><div id="allPlayerList"></div></div>
            </div>
            <div id="admin-waitPlayer" class="admin-page">
                <div class="box"><h3>待审核球员</h3><div id="waitPlayerList"></div></div>
            </div>
            <div id="admin-waitGoal" class="admin-page">
                <div class="box"><h3>待审核进球</h3><div id="waitGoalList"></div></div>
            </div>
            <div id="admin-waitTeam" class="admin-page">
                <div class="box"><h3>待审核小队</h3><div id="waitTeamList"></div></div>
            </div>
        </div>
    </div>
</div>

<div id="regModal" class="modal hide">
    <div class="modal-content">
        <h3>注册新球员</h3>
        <input type="text" id="regName" placeholder="输入姓名">
        <input type="password" id="regPwd" placeholder="2位数字密码" maxlength="2">
        <div style="margin-top:15px; display:flex; gap:10px; justify-content:flex-end;">
            <button class="btn-gray" onclick="closeRegModal()">取消</button>
            <button class="btn-blue" onclick="submitReg()">提交注册</button>
        </div>
    </div>
</div>

<div id="msgModal" class="modal hide">
    <div class="modal-content" style="text-align:center;">
        <p id="msgText" style="font-size:18px;margin-bottom:20px;"></p>
        <button class="btn-blue" onclick="closeMsgModal()">确定</button>
    </div>
</div>

<script>
    const API = "https://footballpoint.top";
    const ADMIN_PWD = "20041202";
    let refreshTimer;

    function switchPage(pageId){
        document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
        document.querySelectorAll(".nav button").forEach(b=>b.className="normal");
        document.getElementById(pageId).classList.add("active");
        event.target.className="active";

        if(pageId==="rank") loadRankList();
        if(pageId==="admin") refreshBadge();
    }
    function switchAdminPage(pageId){
        document.querySelectorAll(".admin-page").forEach(p=>p.classList.remove("active"));
        document.querySelectorAll(".admin-nav button").forEach(b=>b.className="");
        document.getElementById("admin-"+pageId).classList.add("active");
        event.target.className="active";
    }

    function showMsg(txt){
        document.getElementById("msgText").innerText=txt;
        document.getElementById("msgModal").classList.remove("hide");
    }
    function closeMsgModal(){
        document.getElementById("msgModal").classList.add("hide");
    }
    function openRegModal(){document.getElementById("regModal").classList.remove("hide");}
    function closeRegModal(){document.getElementById("regModal").classList.add("hide");}

    function adminEnterTeam(){
        let pwd = document.getElementById("teamAdminPwd").value.trim();
        if(pwd === ADMIN_PWD){
            document.getElementById("teamAuthBox").classList.add("hide");
            document.getElementById("teamMainBox").classList.remove("hide");
            showMsg("管理员已进入善意组队");
            loadSignList();
        }else{
            showMsg("管理员密码错误");
        }
    }

    async function exportWechatSignup(){
        const res = await fetch(API+"/getSignupList");
        const list = await res.json();
        let text = "🏃 坪山公园踢球接龙\n";
        list.forEach((name,idx)=>{
            text += `${idx+1}. ${name}\n`;
        });
        text += "\n接龙格式：序号. 姓名";
        navigator.clipboard.writeText(text).then(()=>{
            showMsg("已复制微信接龙格式，直接粘贴发微信群");
        }).catch(()=>{
            alert(text);
        });
    }

    async function loadSignList(){
        const res = await fetch(API+"/getSignupList");
        const list = await res.json();
        document.getElementById("signCountTip").innerText = `已报名：${list.length}/27人`;
        let html = "";
        list.forEach((name,idx)=>{
            html += `<div style="padding:6px 0;border-bottom:1px solid #eee;">${idx+1}. ${name}</div>`;
        });
        document.getElementById("signList").innerHTML = html || "<p>暂无报名</p>";
    }
    function refreshSignList(){loadSignList();}

    async function parseWechatSignup(){
        let text = document.getElementById("wechatText").value.trim();
        if(!text){
            showMsg("请粘贴微信接龙内容");
            return;
        }
        let reg = /\d+\.\s*([\u4e00-\u9fa5a-zA-Z]+)/g;
        let names = [];
        let match;
        while((match = reg.exec(text))!==null){
            names.push(match[1]);
        }
        if(names.length===0){
            showMsg("未解析到任何姓名，请检查接龙格式");
            return;
        }
        const res = await fetch(API+"/batchWechatImport",{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({names})
        });
        const d = await res.json();
        document.getElementById("importResult").innerText = `解析成功${names.length}人 | 新增注册${d.add}人 | 已存在${d.exist}人 | 全部自动报名完成`;
        showMsg("导入完成，已自动注册并报名");
    }

    async function submitReg(){
        const name = document.getElementById("regName").value.trim();
        const pwd = document.getElementById("regPwd").value.trim();
        if(!name || !/^\d{2}$/.test(pwd)){
            showMsg("请输入姓名和2位数字密码");
            return;
        }
        const res = await fetch(API+"/regPlayer",{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({name,pwd})
        });
        const d = await res.json();
        if(d.ok){
            showMsg("注册成功，等待管理员审核");
            closeRegModal();
        }else{
            showMsg(d.msg);
        }
    }

    async function adminLogin(){
        const pwd = document.getElementById("adminInputPwd").value.trim();
        if(pwd !== ADMIN_PWD){
            showMsg("管理员密码错误");
            return;
        }
        document.getElementById("adminLoginBox").classList.add("hide");
        document.getElementById("adminMainBox").classList.remove("hide");
        showMsg("登录成功");
        loadAllAdminData();
        refreshTimer = setInterval(refreshBadge,3000);
    }
    function adminLogout(){
        clearInterval(refreshTimer);
        document.getElementById("adminLoginBox").classList.remove("hide");
        document.getElementById("adminMainBox").classList.add("hide");
        showMsg("已退出管理员登录");
    }

    async function refreshBadge(){
        const res = await fetch(API+"/getBadgeCount");
        const d = await res.json();
        if(d.waitPlayer>0){
            document.getElementById("waitPlayerBadge").innerText = d.waitPlayer;
            document.getElementById("waitPlayerBadge").classList.remove("hide");
        }else{
            document.getElementById("waitPlayerBadge").classList.add("hide");
        }
        if(d.waitGoal>0){
            document.getElementById("waitGoalBadge").innerText = d.waitGoal;
            document.getElementById("waitGoalBadge").classList.remove("hide");
        }else{
            document.getElementById("waitGoalBadge").classList.add("hide");
        }
        if(d.waitTeam>0){
            document.getElementById("waitTeamBadge").innerText = d.waitTeam;
            document.getElementById("waitTeamBadge").classList.remove("hide");
        }else{
            document.getElementById("waitTeamBadge").classList.add("hide");
        }
        const total = d.waitPlayer + d.waitGoal + d.waitTeam;
        if(total>0){
            document.getElementById("adminBadge").innerText = total;
            document.getElementById("adminBadge").classList.remove("hide");
        }else{
            document.getElementById("adminBadge").classList.add("hide");
        }
    }

    async function loadRankList(){
        const res = await fetch(API+"/getApprovedPlayer");
        const list = await res.json();
        list.sort((a,b)=>(b.goal||0)-(a.goal||0));
        let html = "<table><tr><th>排名</th><th>姓名</th><th>进球</th><th>场次</th></tr>";
        list.forEach((item,idx)=>{
            let cls = "";
            if(idx===0) cls="rank-1";
            if(idx===1) cls="rank-2";
            if(idx===2) cls="rank-3";
            html += `<tr><td class="${cls}">${idx+1}</td><td>${item.name}</td><td>${item.goal||0}</td><td>${item.match||0}</td></tr>`;
        });
        html += "</table>";
        document.getElementById("rankList").innerHTML = html;
    }

    async function checkTeamAuth(){
        const pid = document.getElementById("teamSelPlayer").value;
        const pwd = document.getElementById("teamSelPwd").value;
        if(!pid || !pwd){
            showMsg("请选择球员并输入密码");
            return;
        }
        const res = await fetch(API+"/checkPlayerAuth",{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({pid,pwd})
        });
        const d = await res.json();
        if(d.ok){
            document.getElementById("teamAuthBox").classList.add("hide");
            document.getElementById("teamMainBox").classList.remove("hide");
            showMsg("验证成功，进入组队");
            loadSignList();
        }else{
            showMsg("该球员未审核通过，无法进入");
        }
    }

    async function loadAllAdminData(){
        await loadAllPlayer();
    }

    async function loadAllPlayer(){
        const res = await fetch(API+"/getAllPlayer");
        const list = await res.json();
        let html = "";
        list.forEach(item=>{
            let statusTxt = "";
            if(item.status==="pending") statusTxt="待审核";
            if(item.status==="approved") statusTxt="已通过";
            if(item.status==="rejected") statusTxt="已拒绝";
            if(item.status==="cancelled") statusTxt="已注销";

            html += `
            <div style="padding:8px 0;border-bottom:1px solid #eee;">
                ${item.name} | 密码：${item.password} | 状态：${statusTxt}
                <button class="btn-green" onclick="passPlayer(${item.id})">通过</button>
                <button class="btn-yellow" onclick="rejectPlayer(${item.id})">拒绝</button>
                <button class="btn-red" onclick="cancelPlayer(${item.id})">注销</button>
            </div>
            `;
        });
        document.getElementById("allPlayerList").innerHTML = html;
    }

    async function passPlayer(id){
        await fetch(API+"/operatePlayer",{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({id,type:"pass",adminPwd:ADMIN_PWD})
        });
        showMsg("已通过该球员");
        loadAllAdminData();
    }
    async function rejectPlayer(id){
        await fetch(API+"/operatePlayer",{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({id,type:"reject",adminPwd:ADMIN_PWD})
        });
        showMsg("已拒绝该球员");
        loadAllAdminData();
    }
    async function cancelPlayer(id){
        await fetch(API+"/operatePlayer",{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({id,type:"cancel",adminPwd:ADMIN_PWD})
        });
        showMsg("已注销该球员，密码可复用");
        loadAllAdminData();
    }

    function openGoalModal(){}
    function saveSiteTitle(){}
    function addMatchTime(){}
    function loadWaitPlayer(){}
    function loadWaitGoal(){}
</script>
</body>
</html>
