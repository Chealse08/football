<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>足球分级审核进球系统 - 云端模式</title>
    <style>
        * {margin:0;padding:0;box-sizing:border-box;}
        body {font-family:Microsoft YaHei;background:#f2f3f5;padding:15px;}
        .wrap {max-width:850px;margin:0 auto;background:#fff;border-radius:10px;padding:20px;}
        h1 {text-align:center;margin-bottom:20px;color:#222;}
        .box {margin:15px 0;padding:15px;border:1px solid #eee;border-radius:8px;}
        input,select,textarea {width:100%;padding:10px;margin:6px 0;border:1px solid #ccc;border-radius:5px;font-size:16px;}
        textarea {resize:none;height:80px;}
        button {padding:10px 16px;border:none;border-radius:5px;cursor:pointer;font-size:15px;margin:4px;}
        .btn-blue {background:#0066cc;color:#fff;}
        .btn-red {background:#dc3545;color:#fff;}
        .btn-green {background:#28a745;color:#fff;}
        .hide {display:none;}
        .tip {color:#666;margin:8px 0;}
        .msg {padding:10px;border-radius:5px;margin:10px 0;text-align:center;display:none;}
        .success {background:#d4edda;color:#155724;}
        .error {background:#f8d7da;color:#721c24;}
        .mode-tip {text-align:center;color:#999;font-size:14px;margin-bottom:10px;}
    </style>
</head>
<body>
<div class="wrap">
    <h1>⚽ 球员分级审核进球系统</h1>
    <div class="mode-tip">当前：云端模式（数据保存在服务器）</div>
    <div id="msgBox" class="msg"></div>

    <div class="box">
        <div class="tip">第一步：提交新球员姓名，等待管理员审核认证</div>
        <input type="text" id="newPlayerName" placeholder="输入新球员姓名">
        <button class="btn-blue" onclick="submitNewPlayer()">提交球员名字审核</button>
    </div>

    <div class="box">
        <div class="tip">第二步：仅可选择已审核通过球员，提交进球信息</div>
        <select id="playerSelect">
            <option value="">请先选择已认证球员</option>
        </select>
        <input type="number" id="goalNum" placeholder="输入进球数" min="1">
        <textarea id="matchInfo" placeholder="填写比赛信息"></textarea>
        <button class="btn-blue" onclick="submitGoalRecord()">提交进球记录审核</button>
    </div>

    <div class="box">
        <input type="password" id="adminPwd" placeholder="管理员密码登录后台">
        <button class="btn-green" onclick="adminLogin()">进入管理后台</button>
    </div>

    <div id="adminPanel" class="box hide">
        <h3>待审核球员名单</h3>
        <div id="waitPlayerList"></div>
        <h3 style="margin-top:20px;">待审核进球记录</h3>
        <div id="waitGoalList"></div>
    </div>

    <div class="box">
        <h3>已审核通过射手榜</h3>
        <table>
            <thead>
                <tr>
                    <th>球员姓名</th>
                    <th>进球数</th>
                    <th>比赛信息</th>
                </tr>
            </thead>
            <tbody id="rankList"></tbody>
        </table>
    </div>
</div>

<script>
// ========== 配置区 ==========
const ADMIN_PWD = "20041202";
const API_URL = "https://footballpoint.top";

// 顶部提示
function showMsg(text, isOk){
    let box = document.getElementById("msgBox");
    box.innerText = text;
    box.className = "msg " + (isOk ? "success" : "error");
    box.style.display = "block";
    setTimeout(()=>box.style.display="none",2500);
}

// 提交球员名字
async function submitNewPlayer(){
    let name = document.getElementById("newPlayerName").value.trim();
    if(!name){
        showMsg("请输入球员姓名", false);
        return;
    }
    try {
        await fetch(`${API_URL}/addPlayer`, {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({name: name})
        });
        showMsg("球员名字提交成功，等待管理员审核！", true);
        document.getElementById("newPlayerName").value = "";
        renderWaitPlayer();
    } catch (err) {
        showMsg("提交失败：" + err.message, false);
    }
}

// 提交进球记录
async function submitGoalRecord(){
    let sel = document.getElementById("playerSelect").value;
    let goal = document.getElementById("goalNum").value.trim();
    let match = document.getElementById("matchInfo").value.trim();

    if(!sel){
        showMsg("请选择已审核通过的球员", false);
        return;
    }
    if(!goal || !match){
        showMsg("请填写进球数和比赛信息", false);
        return;
    }
    try {
        await fetch(`${API_URL}/addGoal`, {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
                pid: sel,
                goal: goal,
                match: match
            })
        });
        showMsg("进球记录提交成功，等待审核！", true);
        document.getElementById("goalNum").value = "";
        document.getElementById("matchInfo").value = "";
        renderWaitGoal();
    } catch (err) {
        showMsg("提交失败：" + err.message, false);
    }
}

// 管理员登录
function adminLogin(){
    let pwd = document.getElementById("adminPwd").value.trim();
    if(pwd === ADMIN_PWD){
        document.getElementById("adminPanel").classList.remove("hide");
        showMsg("管理员登录成功", true);
        renderWaitPlayer();
        renderWaitGoal();
    }else{
        showMsg("密码错误", false);
    }
}

// 通过球员
async function passPlayer(id){
    try {
        await fetch(`${API_URL}/passPlayer?id=${id}`, {method: "GET"});
        showMsg("球员认证通过", true);
        renderWaitPlayer();
        renderPlayerSelect();
        renderRank();
    } catch (err) {
        showMsg("操作失败：" + err.message, false);
    }
}

// 驳回球员
async function rejectPlayer(id){
    try {
        await fetch(`${API_URL}/rejectPlayer?id=${id}`, {method: "GET"});
        showMsg("已驳回球员申请", true);
        renderWaitPlayer();
    } catch (err) {
        showMsg("操作失败：" + err.message, false);
    }
}

// 通过进球
async function passGoal(id){
    try {
        await fetch(`${API_URL}/passGoal?id=${id}`, {method: "GET"});
        showMsg("进球审核通过，已上榜", true);
        renderWaitGoal();
        renderRank();
    } catch (err) {
        showMsg("操作失败：" + err.message, false);
    }
}

// 驳回进球
async function rejectGoal(id){
    try {
        await fetch(`${API_URL}/rejectGoal?id=${id}`, {method: "GET"});
        showMsg("已驳回进球记录", true);
        renderWaitGoal();
    } catch (err) {
        showMsg("操作失败：" + err.message, false);
    }
}

// 渲染待审核球员
async function renderWaitPlayer(){
    try {
        let res = await fetch(`${API_URL}/waitPlayers`);
        let list = await res.json();
        let html = "";
        if(list.length === 0){
            html = "<p>暂无待审核球员</p>";
        }else{
            list.forEach(item=>{
                html += `
                <div style="padding:8px;border-bottom:1px solid #eee;">
                    待认证球员：${item.name}
                    <button class="btn-green" onclick="passPlayer(${item.id})">通过认证</button>
                    <button class="btn-red" onclick="rejectPlayer(${item.id})">驳回</button>
                </div>
                `;
            });
        }
        document.getElementById("waitPlayerList").innerHTML = html;
    } catch (err) {
        document.getElementById("waitPlayerList").innerHTML = "<p>加载失败</p>";
    }
}

// 渲染球员下拉
async function renderPlayerSelect(){
    try {
        let res = await fetch(`${API_URL}/players`);
        let list = await res.json();
        let html = '<option value="">请先选择已认证球员</option>';
        list.forEach(item=>{
            html += `<option value="${item.id}">${item.name}</option>`;
        });
        document.getElementById("playerSelect").innerHTML = html;
    } catch (err) {
        document.getElementById("playerSelect").innerHTML = '<option value="">加载失败</option>';
    }
}

// 渲染待审核进球
async function renderWaitGoal(){
    try {
        let res = await fetch(`${API_URL}/waitMatches`);
        let list = await res.json();
        let html = "";
        if(list.length === 0){
            html = "<p>暂无待审核进球记录</p>";
        }else{
            list.forEach(item=>{
                html += `
                <div style="padding:8px;border-bottom:1px solid #eee;">
                    球员：${item.pName}｜进球：${item.goal}｜比赛：${item.match}
                    <button class="btn-green" onclick="passGoal(${item.id})">通过</button>
                    <button class="btn-red" onclick="rejectGoal(${item.id})">驳回</button>
                </div>
                `;
            });
        }
        document.getElementById("waitGoalList").innerHTML = html;
    } catch (err) {
        document.getElementById("waitGoalList").innerHTML = "<p>加载失败</p>";
    }
}

// 渲染射手榜
async function renderRank(){
    try {
        let res = await fetch(`${API_URL}/matches`);
        let list = await res.json();
        let html = "";
        if(list.length === 0){
            html = "<tr><td colspan='3'>暂无记录</td></tr>";
        }else{
            list.forEach(item=>{
                html += `
                <tr>
                    <td>${item.pName}</td>
                    <td>${item.goal}</td>
                    <td>${item.match}</td>
                </tr>
            `;
            });
        }
        document.getElementById("rankList").innerHTML = html;
    } catch (err) {
        document.getElementById("rankList").innerHTML = "<tr><td colspan='3'>加载失败</td></tr>";
    }
}

// 页面加载完成后初始化
window.onload = function(){
    renderPlayerSelect();
    renderRank();
};
</script>
</body>
</html>
